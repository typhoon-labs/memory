<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 508" width="1100" height="508" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">Sensitivity of steady-state annual cost to each assumption</title>
<desc id="d">Base case $587k a year. Each row moves one assumption to its low and high value with the others at base. Staff effort and harness token volume dominate; a gateway that strips prompt caching is the largest avoidable risk. The same numbers are in the table on the page.</desc>
<style>.viz-root{--surface-1:#fcfcfb;--text-primary:#0b0b0b;--text-secondary:#52514e;--grid:#e4e3df;--lower:#2a78d6;--higher:#e34948}@media (prefers-color-scheme: dark){.viz-root{--surface-1:#1a1a19;--text-primary:#f0efec;--text-secondary:#c3c2b7;--grid:#383835;--lower:#3987e5;--higher:#e66767}}.bg{fill:var(--surface-1)}.t1{fill:var(--text-primary)}.t2{fill:var(--text-secondary)}.grid{stroke:var(--grid);stroke-width:1}.base{stroke:var(--text-primary);stroke-width:1.5}.lower{fill:var(--lower)}.higher{fill:var(--higher)}</style>
