<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 616" width="1480" height="616" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">The credential on each hop, and who checks it</title>
<desc id="d">A person signs in through the enterprise IdP and Keycloak. Their token reaches an agent through the gateway. The agent exchanges it at chain-sts for a short token naming the user and itself, for one target. The gateway checks route, role and current actor; the tool checks again and enforces business rules. Model calls leave the gateway with the gateway&#x27;s AWS credential.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606A"/></marker></defs>
<rect width="1480" height="616" fill="#FFFFFF"/>
<text x="24" y="34" font-size="20" font-weight="700" fill="#1F2328" text-anchor="start">The credential on each hop, and who checks it</text>
<text x="24" y="56" font-size="12.5" font-weight="normal" fill="#57606A" text-anchor="start">User identity is carried to the tool. AWS credentials never carry user identity. Each token is for one audience.</text>
<rect x="24" y="176" width="190" height="60" rx="8" fill="#E8F1FB" stroke="#2F6DB5" stroke-width="1.5"/>
<text x="34" y="196" font-size="13" font-weight="600" fill="#1F2328" text-anchor="start">Person</text>
<text x="34" y="214" font-size="11.5" font-weight="normal" fill="#57606A" text-anchor="start">Harness, UI, CLI</text>
<rect x="314" y="176" width="190" height="60" rx="8" fill="#E9F6EE" stroke="#2E8A57" stroke-width="1.5"/>
<text x="324" y="196" font-size="13" font-weight="600" fill="#1F2328" text-anchor="start">Agentgateway</text>
<text x="324" y="214" font-size="11.5" font-weight="normal" fill="#57606A" text-anchor="start">route A: the agent</text>
<rect x="604" y="176" width="190" height="60" rx="8" fill="#E9F6EE" stroke="#2E8A57" stroke-width="1.5"/>
<text x="614" y="196" font-size="13" font-weight="600" fill="#1F2328" text-anchor="start">Agent</text>
<text x="614" y="214" font-size="11.5" font-weight="normal" fill="#57606A" text-anchor="start">Deployment or Job</text>
<rect x="894" y="176" width="190" height="60" rx="8" fill="#E9F6EE" stroke="#2E8A57" stroke-width="1.5"/>
<text x="904" y="196" font-size="13" font-weight="600" fill="#1F2328" text-anchor="start">Agentgateway</text>
<text x="904" y="214" font-size="11.5" font-weight="normal" fill="#57606A" text-anchor="start">route B: the tool</text>
<rect x="1184" y="176" width="190" height="60" rx="8" fill="#FFF4E0" stroke="#B7791F" stroke-width="1.5"/>
<text x="1194" y="196" font-size="13" font-weight="600" fill="#1F2328" text-anchor="start">MCP tool</text>
<text x="1194" y="214" font-size="11.5" font-weight="normal" fill="#57606A" text-anchor="start">business rules</text>
<rect x="24" y="80" width="190" height="60" rx="8" fill="#E9F6EE" stroke="#2E8A57" stroke-width="1.5"/>
<text x="34" y="100" font-size="13" font-weight="600" fill="#1F2328" text-anchor="start">Keycloak</text>
<text x="34" y="118" font-size="11.5" font-weight="normal" fill="#57606A" text-anchor="start">brokers the IdP</text>
<rect x="604" y="80" width="190" height="60" rx="8" fill="#FFF4E0" stroke="#B7791F" stroke-width="1.5"/>
<text x="614" y="100" font-size="13" font-weight="600" fill="#1F2328" text-anchor="start">chain-sts</text>
<text x="614" y="118" font-size="11.5" font-weight="normal" fill="#57606A" text-anchor="start">token exchange</text>
<line x1="90" y1="176" x2="90" y2="140" stroke="#57606A" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="98" y="162" font-size="10.5" font-weight="normal" fill="#57606A" text-anchor="start">0  sign in</text>
<line x1="150" y1="140" x2="150" y2="176" stroke="#57606A" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="158" y="162" font-size="10.5" font-weight="normal" fill="#57606A" text-anchor="start">token</text>
<line x1="214" y1="206" x2="314" y2="206" stroke="#57606A" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="222" y="198" font-size="10.5" font-weight="normal" fill="#57606A" text-anchor="start">1  token, aud = A</text>
<line x1="504" y1="206" x2="604" y2="206" stroke="#57606A" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="516" y="198" font-size="10.5" font-weight="normal" fill="#57606A" text-anchor="start">passthrough</text>
<line x1="670" y1="176" x2="670" y2="140" stroke="#57606A" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="678" y="162" font-size="10.5" font-weight="normal" fill="#57606A" text-anchor="start">2  exchange</text>
<line x1="740" y1="140" x2="740" y2="176" stroke="#57606A" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="748" y="162" font-size="10.5" font-weight="normal" fill="#57606A" text-anchor="start">chain token</text>
<line x1="794" y1="206" x2="894" y2="206" stroke="#57606A" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="806" y="198" font-size="10.5" font-weight="normal" fill="#57606A" text-anchor="start">3  aud = B</text>
<line x1="1084" y1="206" x2="1184" y2="206" stroke="#57606A" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="1096" y="198" font-size="10.5" font-weight="normal" fill="#57606A" text-anchor="start">passthrough</text>
<rect x="24" y="262" width="1430" height="40" rx="0" fill="#F6F8FA" stroke="#E1E4E8" stroke-width="1"/>
<text x="34" y="287" font-size="12" font-weight="700" fill="#1F2328" text-anchor="start">Hop</text>
<text x="264" y="287" font-size="12" font-weight="700" fill="#1F2328" text-anchor="start">Credential presented</text>
<text x="754" y="287" font-size="12" font-weight="700" fill="#1F2328" text-anchor="start">Checked by</text>
<text x="964" y="287" font-size="12" font-weight="700" fill="#1F2328" text-anchor="start">Decision made there</text>
<rect x="24" y="302" width="1430" height="40" rx="0" fill="#FFFFFF" stroke="#E1E4E8" stroke-width="1"/>
<text x="34" y="327" font-size="12" font-weight="normal" fill="#1F2328" text-anchor="start">Person to Keycloak</text>
<text x="264" y="327" font-size="12" font-weight="normal" fill="#1F2328" text-anchor="start">IdP session (OIDC broker), MFA at the IdP</text>
<text x="754" y="327" font-size="12" font-weight="normal" fill="#2F6DB5" text-anchor="start">Keycloak</text>
<text x="964" y="327" font-size="12" font-weight="normal" fill="#1F2328" text-anchor="start">Who the person is; groups mapped to roles and team</text>
<rect x="24" y="342" width="1430" height="40" rx="0" fill="#FBFCFD" stroke="#E1E4E8" stroke-width="1"/>
<text x="34" y="367" font-size="12" font-weight="normal" fill="#1F2328" text-anchor="start">Client to gateway, route A</text>
<text x="264" y="367" font-size="12" font-weight="normal" fill="#1F2328" text-anchor="start">Keycloak access token, aud = route A, PKCE or device flow</text>
<text x="754" y="367" font-size="12" font-weight="normal" fill="#2F6DB5" text-anchor="start">Gateway</text>
<text x="964" y="367" font-size="12" font-weight="normal" fill="#1F2328" text-anchor="start">Valid issuer, audience, expiry; role may call this agent</text>
<rect x="24" y="382" width="1430" height="40" rx="0" fill="#FFFFFF" stroke="#E1E4E8" stroke-width="1"/>
<text x="34" y="407" font-size="12" font-weight="normal" fill="#1F2328" text-anchor="start">Agent to chain-sts</text>
<text x="264" y="407" font-size="12" font-weight="normal" fill="#1F2328" text-anchor="start">subject_token = caller&#x27;s token; actor_token = projected SA token, aud chain-sts</text>
<text x="754" y="407" font-size="12" font-weight="normal" fill="#2F6DB5" text-anchor="start">chain-sts (TokenReview)</text>
<text x="964" y="407" font-size="12" font-weight="normal" fill="#1F2328" text-anchor="start">This agent may act for users on target B; chain length; lifetime</text>
<rect x="24" y="422" width="1430" height="40" rx="0" fill="#FBFCFD" stroke="#E1E4E8" stroke-width="1"/>
<text x="34" y="447" font-size="12" font-weight="normal" fill="#1F2328" text-anchor="start">Agent to gateway, route B</text>
<text x="264" y="447" font-size="12" font-weight="normal" fill="#1F2328" text-anchor="start">Chain token: sub = user, act.sub = agent, aud = route B</text>
<text x="754" y="447" font-size="12" font-weight="normal" fill="#2F6DB5" text-anchor="start">Gateway</text>
<text x="964" y="447" font-size="12" font-weight="normal" fill="#1F2328" text-anchor="start">Role allows tool; current actor (act.sub) allowed for this tool</text>
<rect x="24" y="462" width="1430" height="40" rx="0" fill="#FFFFFF" stroke="#E1E4E8" stroke-width="1"/>
<text x="34" y="487" font-size="12" font-weight="normal" fill="#1F2328" text-anchor="start">Gateway to tool</text>
<text x="264" y="487" font-size="12" font-weight="normal" fill="#1F2328" text-anchor="start">Same chain token (passthrough), over mTLS where the mesh runs</text>
<text x="754" y="487" font-size="12" font-weight="normal" fill="#2F6DB5" text-anchor="start">Tool</text>
<text x="964" y="487" font-size="12" font-weight="normal" fill="#1F2328" text-anchor="start">Re-verify token and current actor; ownership, approval, state, idempotency</text>
<rect x="24" y="502" width="1430" height="40" rx="0" fill="#FBFCFD" stroke="#E1E4E8" stroke-width="1"/>
<text x="34" y="527" font-size="12" font-weight="normal" fill="#1F2328" text-anchor="start">Gateway to Bedrock</text>
<text x="264" y="527" font-size="12" font-weight="normal" fill="#1F2328" text-anchor="start">Gateway&#x27;s IAM role (EKS Pod Identity), SigV4</text>
<text x="754" y="527" font-size="12" font-weight="normal" fill="#2F6DB5" text-anchor="start">AWS IAM</text>
<text x="964" y="527" font-size="12" font-weight="normal" fill="#1F2328" text-anchor="start">Which models the platform may invoke. No user identity here</text>
<rect x="24" y="542" width="1430" height="40" rx="0" fill="#FFFFFF" stroke="#E1E4E8" stroke-width="1"/>
<text x="34" y="567" font-size="12" font-weight="normal" fill="#1F2328" text-anchor="start">Workload with no user</text>
<text x="264" y="567" font-size="12" font-weight="normal" fill="#1F2328" text-anchor="start">Client credentials at Keycloak, or a per-route workload key</text>
<text x="754" y="567" font-size="12" font-weight="normal" fill="#2F6DB5" text-anchor="start">Gateway</text>
<text x="964" y="567" font-size="12" font-weight="normal" fill="#1F2328" text-anchor="start">Workload&#x27;s own role; attributed to its owner and workflow</text>
<text x="24" y="602" font-size="11.5" font-weight="normal" fill="#57606A" text-anchor="start" font-style="italic">Current actor only: authorization reads act.sub. Nested prior actors are for audit (RFC 8693, section 4.1).</text>
</svg>
