<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 652" width="1240" height="652" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">The agent platform at a glance</title>
<desc id="d">People, pipelines and internal apps reach models, team tools and hosted agents through one door, Agentgateway, which knows who is calling, what they may use, how much they may use and what it cost. Identity is on the left: Okta or Ping for people, Keycloak for platform sign-in, chain-sts for agents acting for people. Records are on the right: Dynatrace, Langfuse, audit and usage. Everything runs on the EKS clusters, GitLab and AWS accounts already operated.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606A"/></marker></defs>
<rect width="1240" height="652" fill="#FFFFFF"/>
<text x="20" y="34" font-size="20" font-weight="700" fill="#1F2328" text-anchor="start">The agent platform at a glance</text>
<text x="20" y="56" font-size="12.5" font-weight="normal" fill="#57606A" text-anchor="start">Every model, tool and agent call goes through one door that knows who is calling, what they may use and what it costs.</text>
<rect x="270" y="74" width="700" height="108" rx="10" fill="#FAFBFC" stroke="#E1E4E8" stroke-width="1"/>
<text x="282" y="92" font-size="10.5" font-weight="700" fill="#57606A" text-anchor="start">WHO USES IT</text>
<rect x="280" y="100" width="210" height="72" rx="8" fill="#E8F1FB" stroke="#2F6DB5" stroke-width="1.5"/>
<text x="290" y="120" font-size="13" font-weight="600" fill="#1F2328" text-anchor="start">Developers</text>
<text x="290" y="138" font-size="11.5" font-weight="normal" fill="#57606A" text-anchor="start">in Claude Code and Xcode</text>
<rect x="515" y="100" width="210" height="72" rx="8" fill="#E8F1FB" stroke="#2F6DB5" stroke-width="1.5"/>
<text x="525" y="120" font-size="13" font-weight="600" fill="#1F2328" text-anchor="start">Pipelines</text>
<text x="525" y="138" font-size="11.5" font-weight="normal" fill="#57606A" text-anchor="start">MR reviewer, CI triage</text>
<rect x="750" y="100" width="210" height="72" rx="8" fill="#FFF4E0" stroke="#B7791F" stroke-width="1.5"/>
<text x="760" y="120" font-size="13" font-weight="600" fill="#1F2328" text-anchor="start">Internal apps</text>
<text x="760" y="138" font-size="11.5" font-weight="normal" fill="#57606A" text-anchor="start">helpdesk, incident chat</text>
<rect x="280" y="214" width="680" height="128" rx="8" fill="#E9F6EE" stroke="#2E8A57" stroke-width="1.5"/>
<text x="296" y="240" font-size="15" font-weight="700" fill="#1F2328" text-anchor="start">Agentgateway: the only door</text>
<rect x="296" y="256" width="152" height="70" rx="6" fill="#FFFFFF" stroke="#9CC9AE" stroke-width="1"/>
<text x="306" y="280" font-size="12.5" font-weight="600" fill="#1F2328" text-anchor="start">Who is calling</text>
<text x="306" y="300" font-size="11" font-weight="normal" fill="#57606A" text-anchor="start">verified token</text>
<rect x="460" y="256" width="152" height="70" rx="6" fill="#FFFFFF" stroke="#9CC9AE" stroke-width="1"/>
<text x="470" y="280" font-size="12.5" font-weight="600" fill="#1F2328" text-anchor="start">What they may use</text>
<text x="470" y="300" font-size="11" font-weight="normal" fill="#57606A" text-anchor="start">routes, tools, models</text>
<rect x="624" y="256" width="152" height="70" rx="6" fill="#FFFFFF" stroke="#9CC9AE" stroke-width="1"/>
<text x="634" y="280" font-size="12.5" font-weight="600" fill="#1F2328" text-anchor="start">How much</text>
<text x="634" y="300" font-size="11" font-weight="normal" fill="#57606A" text-anchor="start">token limits, budgets</text>
<rect x="788" y="256" width="152" height="70" rx="6" fill="#FFFFFF" stroke="#9CC9AE" stroke-width="1"/>
<text x="798" y="280" font-size="12.5" font-weight="600" fill="#1F2328" text-anchor="start">What it cost</text>
<text x="798" y="300" font-size="11" font-weight="normal" fill="#57606A" text-anchor="start">usage per person, team</text>
<rect x="270" y="374" width="700" height="108" rx="10" fill="#FAFBFC" stroke="#E1E4E8" stroke-width="1"/>
<text x="282" y="392" font-size="10.5" font-weight="700" fill="#57606A" text-anchor="start">WHAT IT REACHES</text>
<rect x="280" y="400" width="210" height="72" rx="8" fill="#E8F1FB" stroke="#2F6DB5" stroke-width="1.5"/>
<text x="290" y="420" font-size="13" font-weight="600" fill="#1F2328" text-anchor="start">Amazon Bedrock</text>
<text x="290" y="438" font-size="11.5" font-weight="normal" fill="#57606A" text-anchor="start">approved models only</text>
<rect x="515" y="400" width="210" height="72" rx="8" fill="#FFF4E0" stroke="#B7791F" stroke-width="1.5"/>
<text x="525" y="420" font-size="13" font-weight="600" fill="#1F2328" text-anchor="start">Team tools</text>
<text x="525" y="438" font-size="11.5" font-weight="normal" fill="#57606A" text-anchor="start">MCP servers, own rules</text>
<rect x="750" y="400" width="210" height="72" rx="8" fill="#E9F6EE" stroke="#2E8A57" stroke-width="1.5"/>
<text x="760" y="420" font-size="13" font-weight="600" fill="#1F2328" text-anchor="start">Hosted agents</text>
<text x="760" y="438" font-size="11.5" font-weight="normal" fill="#57606A" text-anchor="start">ordinary apps on EKS</text>
<line x1="385" y1="172" x2="385" y2="214" stroke="#57606A" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="385" y1="342" x2="385" y2="400" stroke="#57606A" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="620" y1="172" x2="620" y2="214" stroke="#57606A" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="620" y1="342" x2="620" y2="400" stroke="#57606A" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="855" y1="172" x2="855" y2="214" stroke="#57606A" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="855" y1="342" x2="855" y2="400" stroke="#57606A" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="10" y="74" width="246" height="408" rx="10" fill="#FAFBFC" stroke="#E1E4E8" stroke-width="1"/>
<text x="22" y="92" font-size="10.5" font-weight="700" fill="#57606A" text-anchor="start">IDENTITY</text>
<rect x="20" y="100" width="226" height="72" rx="8" fill="#E8F1FB" stroke="#2F6DB5" stroke-width="1.5"/>
<text x="30" y="120" font-size="13" font-weight="600" fill="#1F2328" text-anchor="start">Okta or Ping</text>
<text x="30" y="138" font-size="11.5" font-weight="normal" fill="#57606A" text-anchor="start">who people are (today&#x27;s tier)</text>
<rect x="20" y="214" width="226" height="72" rx="8" fill="#E9F6EE" stroke="#2E8A57" stroke-width="1.5"/>
<text x="30" y="234" font-size="13" font-weight="600" fill="#1F2328" text-anchor="start">Keycloak</text>
<text x="30" y="252" font-size="11.5" font-weight="normal" fill="#57606A" text-anchor="start">platform sign-in and tokens</text>
<rect x="20" y="328" width="226" height="72" rx="8" fill="#FFF4E0" stroke="#B7791F" stroke-width="1.5"/>
<text x="30" y="348" font-size="13" font-weight="600" fill="#1F2328" text-anchor="start">chain-sts</text>
<text x="30" y="366" font-size="11.5" font-weight="normal" fill="#57606A" text-anchor="start">agents acting for people,</text>
<text x="30" y="382" font-size="11.5" font-weight="normal" fill="#57606A" text-anchor="start">one target, five minutes</text>
<line x1="133" y1="172" x2="133" y2="214" stroke="#57606A" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="133" y1="286" x2="133" y2="328" stroke="#57606A" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="246" y1="278" x2="280" y2="278" stroke="#57606A" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="984" y="74" width="246" height="408" rx="10" fill="#FAFBFC" stroke="#E1E4E8" stroke-width="1"/>
<text x="996" y="92" font-size="10.5" font-weight="700" fill="#57606A" text-anchor="start">RECORDS</text>
<rect x="994" y="100" width="226" height="72" rx="8" fill="#E8F1FB" stroke="#2F6DB5" stroke-width="1.5"/>
<text x="1004" y="120" font-size="13" font-weight="600" fill="#1F2328" text-anchor="start">Dynatrace</text>
<text x="1004" y="138" font-size="11.5" font-weight="normal" fill="#57606A" text-anchor="start">is it healthy?</text>
<rect x="994" y="194" width="226" height="72" rx="8" fill="#E9F6EE" stroke="#2E8A57" stroke-width="1.5"/>
<text x="1004" y="214" font-size="13" font-weight="600" fill="#1F2328" text-anchor="start">Langfuse</text>
<text x="1004" y="232" font-size="11.5" font-weight="normal" fill="#57606A" text-anchor="start">is it any good?</text>
<rect x="994" y="288" width="226" height="72" rx="8" fill="#FFF4E0" stroke="#B7791F" stroke-width="1.5"/>
<text x="1004" y="308" font-size="13" font-weight="600" fill="#1F2328" text-anchor="start">Audit</text>
<text x="1004" y="326" font-size="11.5" font-weight="normal" fill="#57606A" text-anchor="start">who did what?</text>
<rect x="994" y="382" width="226" height="72" rx="8" fill="#FFF4E0" stroke="#B7791F" stroke-width="1.5"/>
<text x="1004" y="402" font-size="13" font-weight="600" fill="#1F2328" text-anchor="start">Usage ledger</text>
<text x="1004" y="420" font-size="11.5" font-weight="normal" fill="#57606A" text-anchor="start">what did it cost?</text>
<line x1="960" y1="278" x2="994" y2="278" stroke="#57606A" stroke-width="1.6" marker-end="url(#arrow)" stroke-dasharray="5 4"/>
<rect x="10" y="498" width="1220" height="50" rx="10" fill="#FAFBFC" stroke="#E1E4E8" stroke-width="1"/>
<text x="22" y="516" font-size="10.5" font-weight="700" fill="#57606A" text-anchor="start">FOUNDATION</text>
<text x="24" y="534" font-size="12" font-weight="normal" fill="#1F2328" text-anchor="start">Runs on the EKS clusters, GitLab, ECR and AWS accounts we already operate. Nothing outside the request path (catalog, Langfuse, dashboards) can stop agents.</text>
<text x="24" y="566" font-size="11" font-weight="700" fill="#57606A" text-anchor="start">Status</text>
<rect x="24" y="578" width="18" height="12" rx="3" fill="#E8F1FB" stroke="#2F6DB5"/>
<text x="50" y="588.5" font-size="11" font-weight="normal" fill="#1F2328" text-anchor="start">Reuse: exists today</text>
<rect x="24" y="598" width="18" height="12" rx="3" fill="#E9F6EE" stroke="#2E8A57"/>
<text x="50" y="608.5" font-size="11" font-weight="normal" fill="#1F2328" text-anchor="start">Adopt: new OSS, run by the platform</text>
<rect x="24" y="618" width="18" height="12" rx="3" fill="#FFF4E0" stroke="#B7791F"/>
<text x="50" y="628.5" font-size="11" font-weight="normal" fill="#1F2328" text-anchor="start">Build: thin, organization-specific</text>
<text x="420" y="590" font-size="11" font-weight="normal" fill="#57606A" text-anchor="start">Optional and deferred parts (kagent, Agent Substrate, AgentCore) are not shown: none is needed for the first use cases.</text>
</svg>
