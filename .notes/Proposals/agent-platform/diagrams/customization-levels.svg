<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="756" viewBox="0 0 1280 756" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="t">Four levels of building on the platform</title>
<desc id="d">Four steps rising from left to right. Level 0, configure: the team writes prompts, skills, scenarios and the choice of model and tools, and the pipeline builds the image from the base application image. Level 1, publish a capability: an MCP adapter or a guidance bundle in the service repository, with an image only for a hosted MCP server. Level 2, compose: a thin application that imports the shared packages, in its own image. Level 3, replace a piece: its own implementation of one package behind the same protocol. A strip underneath shows that shared work reaches a component as merge requests: pipeline logic, deployment conventions, runtime packages, the base image and repository plumbing.</desc>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#52514e"/></marker>
<marker id="ahd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#d03b3b"/></marker>
</defs>
<rect x="0.5" y="0.5" width="1279" height="755" rx="14" fill="#fcfcfb" stroke="#e4e3df"/>
<text x="32.0" y="46.0" font-size="19" font-weight="700" fill="#0b0b0b" text-anchor="start">Four levels of building on the platform</text>
<text x="32.0" y="68.0" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">A team goes only as deep as its use case needs. Proposed conventions; no package, starter or application has been built.</text>
<rect x="32.0" y="190" width="292.0" height="292" rx="8" fill="#e4effc" stroke="#2a78d6" stroke-width="1.6"/>
<circle cx="62.0" cy="222" r="16" fill="#ffffff" stroke="#2a78d6" stroke-width="1.6"/>
<text x="62.0" y="228.0" font-size="17" font-weight="700" fill="#0b0b0b" text-anchor="middle">0</text>
<text x="88.0" y="215.0" font-size="9.5" font-weight="700" fill="#6f6e69" text-anchor="start" letter-spacing="0.6">LEVEL</text>
<text x="88.0" y="234.0" font-size="15.5" font-weight="700" fill="#0b0b0b" text-anchor="start">Configure</text>
<text x="46.0" y="266.0" font-size="9" font-weight="700" fill="#6f6e69" text-anchor="start" letter-spacing="0.5">THE TEAM WRITES</text>
<text x="46.0" y="282.0" font-size="11.5" font-weight="400" fill="#0b0b0b" text-anchor="start">Prompts, skills, scenarios and the choice of</text>
<text x="46.0" y="297.6" font-size="11.5" font-weight="400" fill="#0b0b0b" text-anchor="start">model and tools.</text>
<text x="46.0" y="321.3" font-size="9" font-weight="700" fill="#6f6e69" text-anchor="start" letter-spacing="0.5">IMAGE</text>
<text x="46.0" y="337.3" font-size="11.5" font-weight="400" fill="#0b0b0b" text-anchor="start">Built by the pipeline from the base application</text>
<text x="46.0" y="352.9" font-size="11.5" font-weight="400" fill="#0b0b0b" text-anchor="start">image. No code or Dockerfile in the repository.</text>
<text x="46.0" y="376.6" font-size="9" font-weight="700" fill="#6f6e69" text-anchor="start" letter-spacing="0.5">REPOSITORY</text>
<text x="46.0" y="392.6" font-size="11.5" font-weight="400" fill="#0b0b0b" text-anchor="start">An agent repository without src/.</text>
<path d="M46.0,428 L310.0,428" stroke="#2a78d6" stroke-width="1" opacity="0.35"/>
<text x="46.0" y="444.0" font-size="11" font-weight="400" fill="#52514e" text-anchor="start" font-style="italic">A release like any other: the bytes that were</text>
<text x="46.0" y="458.7" font-size="11" font-weight="400" fill="#52514e" text-anchor="start" font-style="italic">evaluated are the bytes that run.</text>
<rect x="340.0" y="162" width="292.0" height="292" rx="8" fill="#e4effc" stroke="#2a78d6" stroke-width="1.6"/>
<circle cx="370.0" cy="194" r="16" fill="#ffffff" stroke="#2a78d6" stroke-width="1.6"/>
<text x="370.0" y="200.0" font-size="17" font-weight="700" fill="#0b0b0b" text-anchor="middle">1</text>
<text x="396.0" y="187.0" font-size="9.5" font-weight="700" fill="#6f6e69" text-anchor="start" letter-spacing="0.6">LEVEL</text>
<text x="396.0" y="206.0" font-size="15.5" font-weight="700" fill="#0b0b0b" text-anchor="start">Publish a capability</text>
<text x="354.0" y="238.0" font-size="9" font-weight="700" fill="#6f6e69" text-anchor="start" letter-spacing="0.5">THE TEAM WRITES</text>
<text x="354.0" y="254.0" font-size="11.5" font-weight="400" fill="#0b0b0b" text-anchor="start">An MCP adapter or a guidance bundle, in the</text>
<text x="354.0" y="269.6" font-size="11.5" font-weight="400" fill="#0b0b0b" text-anchor="start">service repository.</text>
<text x="354.0" y="293.3" font-size="9" font-weight="700" fill="#6f6e69" text-anchor="start" letter-spacing="0.5">IMAGE</text>
<text x="354.0" y="309.3" font-size="11.5" font-weight="400" fill="#0b0b0b" text-anchor="start">Only for a hosted MCP server.</text>
<text x="354.0" y="332.9" font-size="9" font-weight="700" fill="#6f6e69" text-anchor="start" letter-spacing="0.5">REPOSITORY</text>
<text x="354.0" y="348.9" font-size="11.5" font-weight="400" fill="#0b0b0b" text-anchor="start">The service repository, with mcp/ and</text>
<text x="354.0" y="364.6" font-size="11.5" font-weight="400" fill="#0b0b0b" text-anchor="start">agent-assets/.</text>
<path d="M354.0,400 L618.0,400" stroke="#2a78d6" stroke-width="1" opacity="0.35"/>
<text x="354.0" y="416.0" font-size="11" font-weight="400" fill="#52514e" text-anchor="start" font-style="italic">Does not touch any assistant's code, and deploys</text>
<text x="354.0" y="430.7" font-size="11" font-weight="400" fill="#52514e" text-anchor="start" font-style="italic">on its own schedule.</text>
<rect x="648.0" y="134" width="292.0" height="292" rx="8" fill="#e4effc" stroke="#2a78d6" stroke-width="1.6"/>
<circle cx="678.0" cy="166" r="16" fill="#ffffff" stroke="#2a78d6" stroke-width="1.6"/>
<text x="678.0" y="172.0" font-size="17" font-weight="700" fill="#0b0b0b" text-anchor="middle">2</text>
<text x="704.0" y="159.0" font-size="9.5" font-weight="700" fill="#6f6e69" text-anchor="start" letter-spacing="0.6">LEVEL</text>
<text x="704.0" y="178.0" font-size="15.5" font-weight="700" fill="#0b0b0b" text-anchor="start">Compose</text>
<text x="662.0" y="210.0" font-size="9" font-weight="700" fill="#6f6e69" text-anchor="start" letter-spacing="0.5">THE TEAM WRITES</text>
<text x="662.0" y="226.0" font-size="11.5" font-weight="400" fill="#0b0b0b" text-anchor="start">A thin application that imports the shared</text>
<text x="662.0" y="241.6" font-size="11.5" font-weight="400" fill="#0b0b0b" text-anchor="start">packages and adds hooks, routes, agents or a</text>
<text x="662.0" y="257.3" font-size="11.5" font-weight="400" fill="#0b0b0b" text-anchor="start">session store.</text>
<text x="662.0" y="280.9" font-size="9" font-weight="700" fill="#6f6e69" text-anchor="start" letter-spacing="0.5">IMAGE</text>
<text x="662.0" y="296.9" font-size="11.5" font-weight="400" fill="#0b0b0b" text-anchor="start">Its own.</text>
<text x="662.0" y="320.6" font-size="9" font-weight="700" fill="#6f6e69" text-anchor="start" letter-spacing="0.5">REPOSITORY</text>
<text x="662.0" y="336.6" font-size="11.5" font-weight="400" fill="#0b0b0b" text-anchor="start">An agent repository with src/ and a Dockerfile.</text>
<path d="M662.0,372 L926.0,372" stroke="#2a78d6" stroke-width="1" opacity="0.35"/>
<text x="662.0" y="388.0" font-size="11" font-weight="400" fill="#52514e" text-anchor="start" font-style="italic">The step up from level 0 happens in the same</text>
<text x="662.0" y="402.7" font-size="11" font-weight="400" fill="#52514e" text-anchor="start" font-style="italic">repository.</text>
<rect x="956.0" y="106" width="292.0" height="292" rx="8" fill="#e4effc" stroke="#2a78d6" stroke-width="1.6"/>
<circle cx="986.0" cy="138" r="16" fill="#ffffff" stroke="#2a78d6" stroke-width="1.6"/>
<text x="986.0" y="144.0" font-size="17" font-weight="700" fill="#0b0b0b" text-anchor="middle">3</text>
<text x="1012.0" y="131.0" font-size="9.5" font-weight="700" fill="#6f6e69" text-anchor="start" letter-spacing="0.6">LEVEL</text>
<text x="1012.0" y="150.0" font-size="15.5" font-weight="700" fill="#0b0b0b" text-anchor="start">Replace a piece</text>
<text x="970.0" y="182.0" font-size="9" font-weight="700" fill="#6f6e69" text-anchor="start" letter-spacing="0.5">THE TEAM WRITES</text>
<text x="970.0" y="198.0" font-size="11.5" font-weight="400" fill="#0b0b0b" text-anchor="start">Its own implementation of one package behind</text>
<text x="970.0" y="213.6" font-size="11.5" font-weight="400" fill="#0b0b0b" text-anchor="start">the same protocol, such as a different UI.</text>
<text x="970.0" y="237.3" font-size="9" font-weight="700" fill="#6f6e69" text-anchor="start" letter-spacing="0.5">IMAGE</text>
<text x="970.0" y="253.3" font-size="11.5" font-weight="400" fill="#0b0b0b" text-anchor="start">Its own.</text>
<text x="970.0" y="276.9" font-size="9" font-weight="700" fill="#6f6e69" text-anchor="start" letter-spacing="0.5">REPOSITORY</text>
<text x="970.0" y="292.9" font-size="11.5" font-weight="400" fill="#0b0b0b" text-anchor="start">None of the starters.</text>
<path d="M970.0,344 L1234.0,344" stroke="#2a78d6" stroke-width="1" opacity="0.35"/>
<text x="970.0" y="360.0" font-size="11" font-weight="400" fill="#52514e" text-anchor="start" font-style="italic">If several teams reach this level for the same</text>
<text x="970.0" y="374.7" font-size="11" font-weight="400" fill="#52514e" text-anchor="start" font-style="italic">piece, the package boundary is in the wrong place.</text>
<path d="M32.0,508.0 L1246.0,508.0" fill="none" stroke="#52514e" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ah)"/>
<text x="640.0" y="528.0" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="middle">Deeper customization: the team writes and maintains more itself</text>
<rect x="32" y="552" width="1216" height="150" rx="12" fill="#f3f2ee" stroke="#d3d2cc" stroke-width="1"/>
<text x="46.0" y="573.0" font-size="10.5" font-weight="700" fill="#52514e" text-anchor="start" letter-spacing="0.6">HOW SHARED WORK REACHES A COMPONENT</text>
<text x="1234.0" y="573.0" font-size="10.5" font-weight="400" fill="#6f6e69" text-anchor="end">pinned by the component; each update is a merge request (MR)</text>
<rect x="46.0" y="584" width="228.0" height="104" rx="8" fill="#ffffff" stroke="#52514e" stroke-width="1.6"/>
<text x="58.0" y="606.0" font-size="13.0" font-weight="700" fill="#0b0b0b" text-anchor="start">Pipeline logic</text>
<text x="58.0" y="623.8" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">CI/CD components in the platform</text>
<text x="58.0" y="639.4" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">repository.</text>
<text x="58.0" y="662.0" font-size="9" font-weight="700" fill="#6f6e69" text-anchor="start" letter-spacing="0.5">ARRIVES AS</text>
<text x="58.0" y="678.0" font-size="12" font-weight="700" fill="#0b0b0b" text-anchor="start">version bump MR</text>
<rect x="286.0" y="584" width="228.0" height="104" rx="8" fill="#ffffff" stroke="#52514e" stroke-width="1.6"/>
<text x="298.0" y="606.0" font-size="13.0" font-weight="700" fill="#0b0b0b" text-anchor="start">Deployment conventions</text>
<text x="298.0" y="623.8" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">The agent and MCP server charts.</text>
<text x="298.0" y="662.0" font-size="9" font-weight="700" fill="#6f6e69" text-anchor="start" letter-spacing="0.5">ARRIVES AS</text>
<text x="298.0" y="678.0" font-size="12" font-weight="700" fill="#0b0b0b" text-anchor="start">selection MR</text>
<rect x="526.0" y="584" width="228.0" height="104" rx="8" fill="#ffffff" stroke="#52514e" stroke-width="1.6"/>
<text x="538.0" y="606.0" font-size="13.0" font-weight="700" fill="#0b0b0b" text-anchor="start">Runtime behavior</text>
<text x="538.0" y="623.8" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">Packages in the GitLab package</text>
<text x="538.0" y="639.4" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">registry.</text>
<text x="538.0" y="662.0" font-size="9" font-weight="700" fill="#6f6e69" text-anchor="start" letter-spacing="0.5">ARRIVES AS</text>
<text x="538.0" y="678.0" font-size="12" font-weight="700" fill="#0b0b0b" text-anchor="start">lockfile bump MR</text>
<rect x="766.0" y="584" width="228.0" height="104" rx="8" fill="#ffffff" stroke="#52514e" stroke-width="1.6"/>
<text x="778.0" y="606.0" font-size="13.0" font-weight="700" fill="#0b0b0b" text-anchor="start">Base application image</text>
<text x="778.0" y="623.8" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">ECR, pinned by digest.</text>
<text x="778.0" y="662.0" font-size="9" font-weight="700" fill="#6f6e69" text-anchor="start" letter-spacing="0.5">ARRIVES AS</text>
<text x="778.0" y="678.0" font-size="12" font-weight="700" fill="#0b0b0b" text-anchor="start">digest bump MR</text>
<rect x="1006.0" y="584" width="228.0" height="104" rx="8" fill="#ffffff" stroke="#52514e" stroke-width="1.6"/>
<text x="1018.0" y="606.0" font-size="13.0" font-weight="700" fill="#0b0b0b" text-anchor="start">Repository plumbing</text>
<text x="1018.0" y="623.8" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">Starters, rendered with Copier.</text>
<text x="1018.0" y="662.0" font-size="9" font-weight="700" fill="#6f6e69" text-anchor="start" letter-spacing="0.5">ARRIVES AS</text>
<text x="1018.0" y="678.0" font-size="12" font-weight="700" fill="#0b0b0b" text-anchor="start">copier update MR</text>
<text x="32.0" y="730.0" font-size="12.5" font-weight="700" fill="#0b0b0b" text-anchor="start">A running consumer does not change without its own checks.</text>
<text x="419.6" y="730.0" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">A team that has not merged an update keeps running its current version.</text>
</svg>
