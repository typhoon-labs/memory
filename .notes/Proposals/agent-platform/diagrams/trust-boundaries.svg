<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="900" viewBox="0 0 1280 900" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="t">Trust boundaries and bypass paths</title>
<desc id="d">A developer client outside the cluster reaches the Agentgateway proxy with an Okta token. Hosted agents call tools and models through the proxy. Five paths must be denied: an agent calling an MCP server or backend directly, an agent calling a model provider directly, a client reaching a runtime API around its entry point, a team policy weakening a platform rule, and a CI job pod making the same direct calls.</desc>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#52514e"/></marker>
<marker id="ahd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#d03b3b"/></marker>
</defs>
<rect x="0.5" y="0.5" width="1279" height="899" rx="14" fill="#fcfcfb" stroke="#e4e3df"/>
<text x="32.0" y="46.0" font-size="19" font-weight="700" fill="#0b0b0b" text-anchor="start">Trust boundaries and bypass paths</text>
<text x="32.0" y="68.0" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">The gateway is a control point only if the paths around it are denied. Solid lines are intended paths; red dashed lines must fail.</text>
<rect x="32" y="90" width="200" height="560" rx="12" fill="#f3f2ee" stroke="#d3d2cc" stroke-width="1"/>
<text x="46.0" y="111.0" font-size="10.5" font-weight="700" fill="#52514e" text-anchor="start" letter-spacing="0.6">OUTSIDE THE CLUSTER</text>
<rect x="262" y="90" width="750" height="560" rx="12" fill="#f3f2ee" stroke="#d3d2cc" stroke-width="1"/>
<text x="276.0" y="111.0" font-size="10.5" font-weight="700" fill="#52514e" text-anchor="start" letter-spacing="0.6">EKS CLUSTER</text>
<rect x="1042" y="90" width="206" height="186" rx="12" fill="#f3f2ee" stroke="#d3d2cc" stroke-width="1"/>
<text x="1056.0" y="111.0" font-size="10.5" font-weight="700" fill="#52514e" text-anchor="start" letter-spacing="0.6">EXTERNAL SERVICES</text>
<rect x="282" y="126" width="710" height="146" rx="12" fill="#faf9f6" stroke="#d3d2cc" stroke-width="1"/>
<text x="296.0" y="147.0" font-size="10.5" font-weight="700" fill="#52514e" text-anchor="start" letter-spacing="0.6">GATEWAY NAMESPACE</text>
<rect x="282" y="296" width="330" height="160" rx="12" fill="#faf9f6" stroke="#d3d2cc" stroke-width="1"/>
<text x="296.0" y="317.0" font-size="10.5" font-weight="700" fill="#52514e" text-anchor="start" letter-spacing="0.6">AGENT WORKLOAD NAMESPACES</text>
<rect x="642" y="296" width="350" height="160" rx="12" fill="#faf9f6" stroke="#d3d2cc" stroke-width="1"/>
<text x="656.0" y="317.0" font-size="10.5" font-weight="700" fill="#52514e" text-anchor="start" letter-spacing="0.6">TOOL AND SERVICE NAMESPACES</text>
<rect x="282" y="480" width="710" height="150" rx="12" fill="#faf9f6" stroke="#d3d2cc" stroke-width="1"/>
<text x="296.0" y="501.0" font-size="10.5" font-weight="700" fill="#52514e" text-anchor="start" letter-spacing="0.6">CI RUNNER NAMESPACE</text>
<rect x="48" y="176" width="168" height="76" rx="8" fill="#ffffff" stroke="#52514e" stroke-width="1.6"/>
<text x="60.0" y="198.0" font-size="13.0" font-weight="700" fill="#0b0b0b" text-anchor="start">Developer client</text>
<text x="60.0" y="215.8" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">IDE or CLI agent</text>
<rect x="48" y="500" width="168" height="104" rx="8" fill="#ebeae6" stroke="#8f8e88" stroke-width="1.6"/>
<text x="60.0" y="522.0" font-size="13.0" font-weight="700" fill="#0b0b0b" text-anchor="start">Okta</text>
<text x="60.0" y="539.8" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">Issues tokens. The</text>
<text x="60.0" y="555.4" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">gateway validates issuer,</text>
<text x="60.0" y="571.0" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">audience and claims.</text>
<rect x="302" y="176" width="440" height="76" rx="8" fill="#e4effc" stroke="#2a78d6" stroke-width="1.6"/>
<text x="314.0" y="198.0" font-size="13.0" font-weight="700" fill="#0b0b0b" text-anchor="start">Agentgateway proxy</text>
<text x="314.0" y="215.8" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">Verifies the caller, applies tool, model and budget policy, and holds the</text>
<text x="314.0" y="231.4" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">provider credential.</text>
<rect x="792" y="176" width="180" height="76" rx="8" fill="#ebeae6" stroke="#8f8e88" stroke-width="1.6"/>
<text x="804.0" y="198.0" font-size="13.0" font-weight="700" fill="#0b0b0b" text-anchor="start">Team-attached policy</text>
<text x="804.0" y="215.8" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">A more specific route or</text>
<text x="804.0" y="231.4" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">backend policy</text>
<rect x="302" y="346" width="290" height="76" rx="8" fill="#e4effc" stroke="#2a78d6" stroke-width="1.6"/>
<text x="314.0" y="368.0" font-size="13.0" font-weight="700" fill="#0b0b0b" text-anchor="start">Hosted agent</text>
<text x="314.0" y="385.8" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">Deployment, Job or kagent actor with its own</text>
<text x="314.0" y="401.4" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">workload identity</text>
<rect x="662" y="346" width="140" height="76" rx="8" fill="#e4effc" stroke="#2a78d6" stroke-width="1.6"/>
<text x="674.0" y="368.0" font-size="13.0" font-weight="700" fill="#0b0b0b" text-anchor="start">MCP server</text>
<text x="674.0" y="385.8" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">Tool adapter</text>
<rect x="842" y="346" width="130" height="76" rx="8" fill="#ebeae6" stroke="#8f8e88" stroke-width="1.6"/>
<text x="854.0" y="368.0" font-size="13.0" font-weight="700" fill="#0b0b0b" text-anchor="start">Service API</text>
<text x="854.0" y="385.8" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">Business</text>
<text x="854.0" y="401.4" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">authorization</text>
<rect x="302" y="530" width="290" height="76" rx="8" fill="#ebeae6" stroke="#8f8e88" stroke-width="1.6"/>
<text x="314.0" y="552.0" font-size="13.0" font-weight="700" fill="#0b0b0b" text-anchor="start">GitLab job pod</text>
<text x="314.0" y="569.8" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">Runs merge request code inside the cluster</text>
<text x="314.0" y="585.4" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">network</text>
<rect x="1058" y="176" width="174" height="76" rx="8" fill="#ffffff" stroke="#52514e" stroke-width="1.6"/>
<text x="1070.0" y="198.0" font-size="13.0" font-weight="700" fill="#0b0b0b" text-anchor="start">Model providers</text>
<text x="1070.0" y="215.8" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">Accept only the gateway's</text>
<text x="1070.0" y="231.4" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">credential</text>
<text x="662.0" y="548.0" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">Runners are self-hosted in this cluster, so job pods get</text>
<text x="662.0" y="563.6" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">the same network policy and node separation as</text>
<text x="662.0" y="579.3" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">untrusted workloads. Deployment rights come only from</text>
<text x="662.0" y="594.9" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">ID-token roles on protected runners.</text>
<path d="M216.0,214.0 L302.0,214.0" fill="none" stroke="#52514e" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ah)"/>
<text x="259.0" y="206.0" font-size="11" font-weight="400" fill="#52514e" text-anchor="middle" style="paint-order:stroke;stroke:#fcfcfb;stroke-width:4px;stroke-linejoin:round">Okta token</text>
<path d="M700.0,176.0 L700.0,152.0 L1145.0,152.0 L1145.0,176.0" fill="none" stroke="#52514e" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ah)"/>
<text x="905.0" y="146.0" font-size="11" font-weight="400" fill="#52514e" text-anchor="middle" style="paint-order:stroke;stroke:#faf9f6;stroke-width:4px;stroke-linejoin:round">provider credential, held only at the gateway</text>
<path d="M700.0,252.0 L700.0,346.0" fill="none" stroke="#52514e" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ah)"/>
<text x="709.0" y="289.0" font-size="11" font-weight="400" fill="#52514e" text-anchor="start" style="paint-order:stroke;stroke:#f3f2ee;stroke-width:4px;stroke-linejoin:round">gateway identity</text>
<path d="M400.0,346.0 L400.0,252.0" fill="none" stroke="#52514e" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ah)"/>
<text x="409.0" y="289.0" font-size="11" font-weight="400" fill="#52514e" text-anchor="start" style="paint-order:stroke;stroke:#f3f2ee;stroke-width:4px;stroke-linejoin:round">delegated context or machine credential</text>
<path d="M802.0,384.0 L842.0,384.0" fill="none" stroke="#52514e" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ah)"/>
<path d="M160.0,252.0 L160.0,366.0 L302.0,366.0" fill="none" stroke="#52514e" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ah)"/>
<text x="168.0" y="296.0" font-size="11" font-weight="400" fill="#52514e" text-anchor="start" style="paint-order:stroke;stroke:#f3f2ee;stroke-width:4px;stroke-linejoin:round">authenticated</text>
<text x="168.0" y="310.0" font-size="11" font-weight="400" fill="#52514e" text-anchor="start" style="paint-order:stroke;stroke:#f3f2ee;stroke-width:4px;stroke-linejoin:round">entry point</text>
<path d="M96.0,252.0 L96.0,404.0 L302.0,404.0" fill="none" stroke="#d03b3b" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="5 4" marker-end="url(#ahd)"/>
<circle cx="282" cy="404" r="8.5" fill="#ffffff" stroke="#d03b3b" stroke-width="1.6"/>
<path d="M278.4,400.4 L285.6,407.6 M285.6,400.4 L278.4,407.6" stroke="#d03b3b" stroke-width="1.9" stroke-linecap="round"/>
<circle cx="96" cy="330" r="9.5" fill="#d03b3b"/>
<text x="96.0" y="334.0" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
<path d="M592.0,384.0 L662.0,384.0" fill="none" stroke="#d03b3b" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="5 4" marker-end="url(#ahd)"/>
<circle cx="642" cy="384" r="8.5" fill="#ffffff" stroke="#d03b3b" stroke-width="1.6"/>
<path d="M638.4,380.4 L645.6,387.6 M645.6,380.4 L638.4,387.6" stroke="#d03b3b" stroke-width="1.9" stroke-linecap="round"/>
<circle cx="617" cy="366" r="9.5" fill="#d03b3b"/>
<text x="617.0" y="370.0" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<path d="M592.0,568.0 L627.0,568.0 L627.0,410.0 L662.0,410.0" fill="none" stroke="#d03b3b" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="5 4" marker-end="url(#ahd)"/>
<circle cx="642" cy="410" r="8.5" fill="#ffffff" stroke="#d03b3b" stroke-width="1.6"/>
<path d="M638.4,406.4 L645.6,413.6 M645.6,406.4 L638.4,413.6" stroke="#d03b3b" stroke-width="1.9" stroke-linecap="round"/>
<circle cx="627" cy="506" r="9.5" fill="#d03b3b"/>
<text x="627.0" y="510.0" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
<path d="M540.0,422.0 L540.0,468.0 L1145.0,468.0 L1145.0,252.0" fill="none" stroke="#d03b3b" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="5 4" marker-end="url(#ahd)"/>
<circle cx="1012" cy="468" r="8.5" fill="#ffffff" stroke="#d03b3b" stroke-width="1.6"/>
<path d="M1008.4,464.4 L1015.6,471.6 M1015.6,464.4 L1008.4,471.6" stroke="#d03b3b" stroke-width="1.9" stroke-linecap="round"/>
<circle cx="780" cy="468" r="9.5" fill="#d03b3b"/>
<text x="780.0" y="472.0" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<path d="M792.0,214.0 L742.0,214.0" fill="none" stroke="#d03b3b" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="5 4" marker-end="url(#ahd)"/>
<circle cx="767" cy="214" r="8.5" fill="#ffffff" stroke="#d03b3b" stroke-width="1.6"/>
<path d="M763.4,210.4 L770.6,217.6 M770.6,210.4 L763.4,217.6" stroke="#d03b3b" stroke-width="1.9" stroke-linecap="round"/>
<circle cx="767" cy="194" r="9.5" fill="#d03b3b"/>
<text x="767.0" y="198.0" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
<text x="32.0" y="686.0" font-size="13" font-weight="700" fill="#0b0b0b" text-anchor="start">Bypass paths and the candidate control for each</text>
<text x="32.0" y="704.0" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">No control is selected yet. Each path needs a denied-path result in the pilot.</text>
<circle cx="42" cy="728.0" r="9.5" fill="#d03b3b"/>
<text x="42.0" y="732.0" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<text x="60.0" y="732.0" font-size="12" font-weight="700" fill="#0b0b0b" text-anchor="start">A workload calls an MCP or backend service directly.</text>
<text x="60.0" y="748.0" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">Network policy from the cluster's policy engine; the backend accepts only the gateway's workload</text>
<text x="60.0" y="763.6" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">identity.</text>
<circle cx="42" cy="787.28" r="9.5" fill="#d03b3b"/>
<text x="42.0" y="791.3" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<text x="60.0" y="791.3" font-size="12" font-weight="700" fill="#0b0b0b" text-anchor="start">A workload calls a model provider directly.</text>
<text x="60.0" y="807.3" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">The provider credential exists only at the gateway; namespace egress is limited to approved</text>
<text x="60.0" y="822.9" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">destinations; provider-side policy.</text>
<circle cx="42" cy="846.56" r="9.5" fill="#d03b3b"/>
<text x="42.0" y="850.6" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
<text x="60.0" y="850.6" font-size="12" font-weight="700" fill="#0b0b0b" text-anchor="start">A client reaches a hosted runtime API around its entry point.</text>
<text x="60.0" y="866.6" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">The runtime API is not exposed outside the cluster; the entry point authenticates the user and binds them</text>
<text x="60.0" y="882.2" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">to the session.</text>
<circle cx="670" cy="728.0" r="9.5" fill="#d03b3b"/>
<text x="670.0" y="732.0" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
<text x="688.0" y="732.0" font-size="12" font-weight="700" fill="#0b0b0b" text-anchor="start">A team attaches a more specific policy that weakens a platform rule.</text>
<text x="688.0" y="748.0" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">RBAC on route, backend and policy resources; Kyverno rules on permitted fields.</text>
<circle cx="670" cy="771.64" r="9.5" fill="#d03b3b"/>
<text x="670.0" y="775.6" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
<text x="688.0" y="775.6" font-size="12" font-weight="700" fill="#0b0b0b" text-anchor="start">A CI job pod makes the same direct calls.</text>
<text x="688.0" y="791.6" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">The runner namespace is included in the network policy and in every denied-path check.</text>
<path d="M660.0,825.3 L706.0,825.3" fill="none" stroke="#52514e" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ah)"/>
<text x="716.0" y="829.3" font-size="11.5" font-weight="400" fill="#0b0b0b" text-anchor="start">Intended path</text>
<path d="M840.0,825.3 L886.0,825.3" fill="none" stroke="#d03b3b" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="5 4" marker-end="url(#ahd)"/>
<circle cx="863" cy="825.28" r="8.5" fill="#ffffff" stroke="#d03b3b" stroke-width="1.6"/>
<path d="M859.4,821.68 L866.6,828.88 M866.6,821.68 L859.4,828.88" stroke="#d03b3b" stroke-width="1.9" stroke-linecap="round"/>
<text x="896.0" y="829.3" font-size="11.5" font-weight="400" fill="#0b0b0b" text-anchor="start">Path that must be denied, with the point where the control acts</text>
<text x="660.0" y="857.3" font-size="11" font-weight="700" fill="#52514e" text-anchor="start">Status</text>
<rect x="710.5" y="845.28" width="26" height="16" rx="4" fill="#ebeae6" stroke="#8f8e88" stroke-width="1.6"/>
<text x="744.5" y="857.3" font-size="11.5" font-weight="400" fill="#0b0b0b" text-anchor="start">Existing, reused</text>
<rect x="856.4" y="845.28" width="26" height="16" rx="4" fill="#e4effc" stroke="#2a78d6" stroke-width="1.6"/>
<text x="890.4" y="857.3" font-size="11.5" font-weight="400" fill="#0b0b0b" text-anchor="start">New in this platform</text>
<rect x="1023.7" y="845.28" width="26" height="16" rx="4" fill="#ffffff" stroke="#52514e" stroke-width="1.6"/>
<text x="1057.7" y="857.3" font-size="11.5" font-weight="400" fill="#0b0b0b" text-anchor="start">External system or actor</text>
</svg>
