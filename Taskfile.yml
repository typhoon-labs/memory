# The tasks that build and run the cluster. Tools come from mise.toml
# (`mise trust && mise install`). The demo's own tasks (reset, break, drive,
# pre-flight, backup drills) are in demo/Taskfile.yml.
#
#   task up        from no cluster to a ready demo: every step in order
#                  (scripts/up.sh). Safe to re-run.
#   task up:trunk  its first step alone: kind cluster, local registry, Gateway
#                  API, Agentgateway, Keycloak and the JWT-protected model route
#   task publish   build and push every image, and push the Sample App chart
#   task install   apply the workloads and their gateway routes, one at a time
#   task policies  apply the controls: network boundaries, Kyverno, admission rules
#   task routes    the gateway routes of the operations domain, and whether they are accepted
#   task down      removes what `task up` created, and nothing else
#   task status    what is running, where to reach it, node memory
#   task token     access token for a user or the machine client
#   task deploy    apply every helmfile under agent-deployments/clusters/dev
#   task smoke     positive and negative checks of the model route
#   task model     which model provider the gateway uses; `-- bedrock` switches
#                  to Amazon Bedrock with the AWS credentials exported in this
#                  shell, `-- local` goes back (30-model-route/scripts/provider.sh)
#   task ui        every web UI and its address; `-- <name>` forwards one that
#                  has no host port, `-- all` forwards the seven (local/ui/ui.sh)
#   task doctor    does this machine have the tools the tasks need (scripts/doctor.sh)
#   task setup     fetch now what the tasks would fetch on first use (scripts/setup.sh)
#
# KUBECONFIG. No task may use the default kubeconfig or the current kube
# context. With Task 3.54 a KUBECONFIG exported in the calling shell replaces a
# Taskfile `env` entry, so `env` alone is not enough. Every command below
# therefore names the repo-local kubeconfig and the context itself:
#
#   kubectl   --kubeconfig "{{.ROOT_DIR}}/local/kind/kubeconfig" --context kind-agentgateway-demo
#   helm      --kubeconfig "{{.ROOT_DIR}}/local/kind/kubeconfig" --kube-context kind-agentgateway-demo
#   helmfile  the same two flags, and KUBECONFIG=... written on the command
#             line itself, because helmfile hooks start kubectl without flags
#   kind      --name agentgateway-demo --kubeconfig "{{.ROOT_DIR}}/local/kind/kubeconfig"
#
# Naming the context is the guard: with any other kubeconfig the context does
# not exist and the command fails before it changes anything. `up` and `deploy`
# also check it first (task `guard`). As a second layer, `env` below sets
# KUBECONFIG and .taskrc.yml turns on ENV_PRECEDENCE so that it wins over the
# shell for included tasks too.
#
# ADDING TASKS. Other workstreams create one of the files under `includes`;
# this file does not need editing. An included task is called as
# `task <namespace>:<task>` and runs in its own directory.
#
# Rules for an included Taskfile, all checked with Task 3.54:
#   - Write the kubeconfig and context flags above on every kubectl, helm,
#     helmfile and kind command. Do not rely on the inherited KUBECONFIG.
#   - Use {{.ROOT_DIR}} for the repository root. {{.TASKFILE_DIR}} is the
#     directory of whichever Taskfile the running task belongs to.
#   - Top-level `vars` are NOT private. A name defined in one included file
#     replaces the same name in this file and in every other included file
#     that does not define it. Prefix variable names with the component's name.
version: "3"

vars:
  # Optional memory cap on the kind node container, such as 12g. Empty means
  # no cap, which is how kind creates a node. Set it for one run with
  # `task up:trunk NODE_MEMORY=12g`. To lift a cap again, recreate the cluster:
  # `docker update --memory 0` leaves a limit unchanged.
  NODE_MEMORY: ""
  # Image names are {{.REGISTRY}}/<component>:<version>.
  REGISTRY: "localhost:5002"

env:
  # The second layer only; see KUBECONFIG above. Written out in full, not
  # built from a variable, because an included Taskfile can replace variables.
  KUBECONFIG: "{{.ROOT_DIR}}/local/kind/kubeconfig"
  GATEWAY_URL: http://localhost:18080
  KEYCLOAK_URL: http://localhost:18081
  # For the checks that take the cluster and the token source from the
  # environment instead of knowing about kind and Keycloak: the platform's
  # tests (agent-platform/tests/) and a component's own scenarios.
  PLATFORM_KUBECONFIG: "{{.ROOT_DIR}}/local/kind/kubeconfig"
  PLATFORM_CONTEXT: kind-agentgateway-demo
  PLATFORM_TOKEN_CMD: "{{.ROOT_DIR}}/local/identity/token.sh"

includes:
  sample-app:
    taskfile: components/sample-app/Taskfile.yml
    dir: components/sample-app
    optional: true
  delivery-mcp:
    taskfile: components/delivery-mcp/Taskfile.yml
    dir: components/delivery-mcp
    optional: true
  remediation-agent:
    taskfile: components/remediation-agent/Taskfile.yml
    dir: components/remediation-agent
    optional: true
  comms-agent:
    taskfile: components/comms-agent/Taskfile.yml
    dir: components/comms-agent
    optional: true
  chat-assistant:
    taskfile: components/chat-assistant/Taskfile.yml
    dir: components/chat-assistant
    optional: true
  diagnosis-agent:
    taskfile: agent-deployments/clusters/dev/workloads/diagnosis-agent/Taskfile.yml
    dir: agent-deployments/clusters/dev/workloads/diagnosis-agent
    optional: true
  observability:
    taskfile: local/observability/Taskfile.yml
    dir: local/observability
    optional: true
  traffic:
    taskfile: local/traffic/Taskfile.yml
    dir: local/traffic
    optional: true
  demo:
    taskfile: demo/Taskfile.yml
    dir: demo
    optional: true
  kagent:
    taskfile: agent-deployments/clusters/dev/platform/60-kagent/Taskfile.yml
    dir: agent-deployments/clusters/dev/platform/60-kagent
    optional: true
  langfuse:
    taskfile: agent-deployments/clusters/dev/platform/50-langfuse/Taskfile.yml
    dir: agent-deployments/clusters/dev/platform/50-langfuse
    optional: true
  registry:
    taskfile: agent-deployments/clusters/dev/platform/70-agentregistry/Taskfile.yml
    dir: agent-deployments/clusters/dev/platform/70-agentregistry
    optional: true
  model:
    taskfile: agent-deployments/clusters/dev/platform/30-model-route/Taskfile.yml
    dir: agent-deployments/clusters/dev/platform/30-model-route
    optional: true
  ui:
    taskfile: local/ui/Taskfile.yml
    dir: local/ui
    optional: true

# The cluster name, the node name and the kubeconfig path are written out in
# the commands below on purpose. They are fixed in docs/cluster.md, and a
# variable could be replaced by an included Taskfile (see above), which must
# never be able to point `down` at another cluster.
tasks:
  default:
    desc: List tasks
    silent: true
    cmds:
      - task --list

  up:
    desc: "From no cluster to a ready demo, every step in order, ending with the pre-flight (safe to re-run; `-- --from <n>` resumes, `-- --list` shows the steps)"
    silent: true
    cmds:
      - '"{{.ROOT_DIR}}/scripts/up.sh" {{.CLI_ARGS}}'

  doctor:
    desc: "Does this machine have what the tasks need: one line per tool, what to do under the NO-GO lines. `-- --dev` adds what a component's own tasks need (node, npm, uv)"
    silent: true
    cmds:
      - '"{{.ROOT_DIR}}/scripts/doctor.sh" {{.CLI_ARGS}}'

  setup:
    desc: "After `mise install`: fetch now what the tasks would fetch on first use (kubectl-ate, arctl). `-- --dev` adds every component's locked packages (npm ci, uv sync). Safe to re-run"
    silent: true
    cmds:
      - '"{{.ROOT_DIR}}/scripts/setup.sh" {{.CLI_ARGS}}'

  up:trunk:
    desc: "Create the cluster trunk: kind, registry, Gateway API, Agentgateway, Keycloak, model route (safe to re-run; the first step of `task up`)"
    cmds:
      - task: tools-check
      - "{{.ROOT_DIR}}/local/registry/registry.sh up"
      - task: cluster-create
      # Restore the repo-local kubeconfig if it was deleted; never the default one.
      - kind export kubeconfig --name agentgateway-demo --kubeconfig "{{.ROOT_DIR}}/local/kind/kubeconfig"
      - task: guard
      - "{{.ROOT_DIR}}/local/registry/registry.sh wire"
      - kubectl --kubeconfig "{{.ROOT_DIR}}/local/kind/kubeconfig" --context kind-agentgateway-demo apply -f "{{.ROOT_DIR}}/local/registry/local-registry-hosting.yaml"
      # Memory and swap go together: Docker rejects a memory limit above the swap limit.
      - 'if [ -n "{{.NODE_MEMORY}}" ]; then docker update --memory "{{.NODE_MEMORY}}" --memory-swap "{{.NODE_MEMORY}}" agentgateway-demo-control-plane; fi'
      # Only the releases labeled layer=trunk, so that `task up:trunk` does not
      # depend on the state of other workstreams. `task deploy` applies all.
      - KUBECONFIG="{{.ROOT_DIR}}/local/kind/kubeconfig" helmfile --kubeconfig "{{.ROOT_DIR}}/local/kind/kubeconfig" --kube-context kind-agentgateway-demo --file "{{.ROOT_DIR}}/agent-deployments/clusters/dev/helmfile.yaml" --selector layer=trunk sync
      - kubectl --kubeconfig "{{.ROOT_DIR}}/local/kind/kubeconfig" --context kind-agentgateway-demo -n agentgateway-system wait --for=condition=Programmed gateway/agentgateway-proxy --timeout=180s
      - kubectl --kubeconfig "{{.ROOT_DIR}}/local/kind/kubeconfig" --context kind-agentgateway-demo -n agentgateway-system rollout status deployment/agentgateway-proxy --timeout=180s
      - kubectl --kubeconfig "{{.ROOT_DIR}}/local/kind/kubeconfig" --context kind-agentgateway-demo -n keycloak rollout status deployment/keycloak --timeout=300s
      # MODEL_PROVIDER=bedrock (or local) in the calling shell switches the
      # model route, now that it is there, as `task model -- bedrock` does.
      # Unset, the provider stays as it is: `local` on a new cluster. A
      # provider that does not answer is reported and does not stop the
      # install.
      - 'if [ -n "${MODEL_PROVIDER:-}" ]; then "{{.ROOT_DIR}}/agent-deployments/clusters/dev/platform/30-model-route/scripts/provider.sh" "${MODEL_PROVIDER}" --warn-only; fi'
      - task: status

  down:
    desc: Remove the kind cluster, the registry and the kubeconfig that `task up` created
    cmds:
      # Deletes only the cluster with this name; other kind clusters are untouched.
      - kind delete cluster --name agentgateway-demo --kubeconfig "{{.ROOT_DIR}}/local/kind/kubeconfig"
      # Removes the registry container only if `task up` created it.
      - "{{.ROOT_DIR}}/local/registry/registry.sh down"
      - rm -f "{{.ROOT_DIR}}/local/kind/kubeconfig" "{{.ROOT_DIR}}/local/kind/kubeconfig.lock"

  status:
    desc: Show what is running and where to reach it
    silent: true
    cmds:
      - "{{.ROOT_DIR}}/local/kind/status.sh"

  token:
    desc: "Print an access token: `task token -- developer`, or `task token -- alert-automation` for the machine client"
    silent: true
    cmds:
      - "{{.ROOT_DIR}}/local/identity/token.sh {{.CLI_ARGS | default \"developer\"}}"

  deploy:
    desc: "Apply every helmfile for the dev cluster; pass helmfile flags after --, such as `-- -l name=sample-app`"
    cmds:
      - task: guard
      - KUBECONFIG="{{.ROOT_DIR}}/local/kind/kubeconfig" helmfile --kubeconfig "{{.ROOT_DIR}}/local/kind/kubeconfig" --kube-context kind-agentgateway-demo --file "{{.ROOT_DIR}}/agent-deployments/clusters/dev/helmfile.yaml" {{.CLI_ARGS}} sync

  publish:
    desc: Build and push every image, and push the Sample App chart as an OCI chart (safe to re-run)
    preconditions:
      - sh: curl --silent --fail --max-time 5 --output /dev/null http://localhost:5002/v2/
        msg: "The registry at localhost:5002 does not answer. Run `task up:trunk`."
    cmds:
      - task: sample-app:build
      - task: sample-app:push
      # Where delivery-mcp's Helm applier expects the chart:
      # oci://agentgateway-demo-registry:5000/charts/sample-app from a pod,
      # which is oci://localhost:5002/charts/sample-app from this machine.
      - task: sample-app:chart:push
      - task: traffic:build
      - task: traffic:push
      - task: delivery-mcp:build
      - task: delivery-mcp:push
      - task: remediation-agent:build
      - task: remediation-agent:push
      - task: comms-agent:build
      - task: comms-agent:push
      - task: chat-assistant:build
      - task: chat-assistant:push
      - cmd: "{{.ROOT_DIR}}/local/registry/contents.sh"
        silent: true

  install:
    desc: Apply the workloads and their routes one at a time (Sample App, traffic, delivery-mcp, the agents, the chat assistant, their gateway routes)
    cmds:
      - for: [sample-app, delivery-mcp-access, delivery-mcp, remediation-agent, comms-agent, chat-assistant]
        task: deploy
        vars: { CLI_ARGS: "-l name={{.ITEM}}" }
      - task: traffic:deploy
      # A route's policy before the route, so it is never served without one.
      - for:
          - delivery-mcp-route-auth
          - delivery-mcp-route
          - remediation-agent-route-auth
          - remediation-agent-route
          - comms-agent-route-auth
          - comms-agent-route
          - chat-assistant-route-auth
          - chat-assistant-route
          - chat-assistant-alert-hook-auth
          - chat-assistant-alert-hook
        task: deploy
        vars: { CLI_ARGS: "-l name={{.ITEM}}" }
      - task: routes

  policies:
    desc: Apply the controls one at a time (network boundaries of agents and tools, Kyverno, the admission rules for gateway resources)
    cmds:
      # Kyverno before the rules that need its resource kinds.
      - for: [agents-network-boundary, tools-network-boundary, kyverno, gateway-rules]
        task: deploy
        vars: { CLI_ARGS: "-l name={{.ITEM}}" }

  routes:
    desc: Show the operations domain's gateway routes and whether the gateway accepted them
    silent: true
    cmds:
      - kubectl --kubeconfig "{{.ROOT_DIR}}/local/kind/kubeconfig" --context kind-agentgateway-demo get httproute,agentgatewaybackend,agentgatewaypolicy -n tools
      - kubectl --kubeconfig "{{.ROOT_DIR}}/local/kind/kubeconfig" --context kind-agentgateway-demo get httproute,agentgatewaybackend,agentgatewaypolicy -n agents

  smoke:
    desc: Check the model route (valid token, no token, wrong audience, unapproved model)
    silent: true
    cmds:
      - "{{.ROOT_DIR}}/agent-platform/tests/model-route.sh"

  # --- helpers ---------------------------------------------------------------

  guard:
    internal: true
    silent: true
    preconditions:
      # Fails fast unless the repo-local kubeconfig exists and resolves to our
      # cluster's context. Reads the file by path, never the shell's KUBECONFIG.
      - sh: test "$(kubectl --kubeconfig "{{.ROOT_DIR}}/local/kind/kubeconfig" config current-context 2>/dev/null)" = "kind-agentgateway-demo"
        msg: |
          {{.ROOT_DIR}}/local/kind/kubeconfig is missing or its context is not kind-agentgateway-demo.
          Nothing was changed. Run `task up:trunk` to create the cluster and the kubeconfig.

  # Before a task starts: the same check as `task doctor`, printing only a
  # tool that is missing or too old, with what to do. A command and not a
  # precondition, because Task does not show what a precondition prints.
  # Tasks in an included Taskfile call it as `:tools-check`.
  tools-check:
    internal: true
    silent: true
    cmds:
      - '"{{.ROOT_DIR}}/scripts/doctor.sh" --quiet'

  cluster-create:
    internal: true
    status:
      - kind get clusters 2>/dev/null | grep -qx agentgateway-demo
    cmds:
      - kind create cluster --name agentgateway-demo --config "{{.ROOT_DIR}}/local/kind/cluster.yaml" --kubeconfig "{{.ROOT_DIR}}/local/kind/kubeconfig" --wait 120s
