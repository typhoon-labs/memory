{{- range $workload := .Values.workloads }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $.Values.backend.name }}-{{ $workload }}
  namespace: {{ $.Release.Namespace }}
spec:
  parentRefs:
    - name: {{ $.Values.gateway.name }}
      namespace: {{ $.Values.gateway.namespace }}
      sectionName: {{ $.Values.gateway.listener }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /workloads/{{ $workload }}/mcp/observability
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: {{ $.Values.backend.name }}
          namespace: {{ $.Values.backend.namespace }}
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: {{ $.Values.backend.name }}-{{ $workload }}-auth
  namespace: {{ $.Release.Namespace }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: {{ $.Values.backend.name }}-{{ $workload }}
  traffic:
    apiKeyAuthentication:
      # Strict: no known key, no MCP session (401). The key is read from
      # `Authorization: Bearer <key>`.
      mode: Strict
      configMapSelector:
        matchLabels:
          agentgateway-demo/workload-key: {{ $workload }}
    # A known key is not enough: it must be this workload's.
    authorization:
      action: Allow
      policy:
        matchExpressions:
          - {{ printf "apiKey.workload == %q" $workload | quote }}
{{- end }}
