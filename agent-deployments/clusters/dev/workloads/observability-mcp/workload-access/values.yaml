# A door to observability-mcp for workloads that present a gateway key instead
# of a Keycloak token.
#
# WHY. /mcp/observability asks for a Keycloak token. A kagent agent cannot
# forward its caller's token to a tool; it can only send a fixed header from a
# Secret. The gateway already issues such a workload a key of its own for the
# model route (agent-platform/profiles/kagent/model-access, mint-key.sh). This
# chart lets the same key open the same MCP backend, on a route of its own.
#
# WHAT, per workload:
#
#   HTTPRoute `observability-mcp-<workload>`
#       /workloads/<workload>/mcp/observability, to the AgentgatewayBackend
#       `observability-mcp` in namespace `tools` (allowed by its ReferenceGrant)
#   AgentgatewayPolicy `observability-mcp-<workload>-auth`
#       apiKeyAuthentication: the caller presents a key whose SHA-256 the
#       gateway knows, and that key must be the one issued to <workload>
#
# Which tools exist is decided once, on the backend, for every route: the
# read-only list in ../values.yaml.
#
# Why a second route and not a second credential on /mcp/observability: the
# key's hash is a ConfigMap in the gateway's namespace, and a policy reads
# ConfigMaps and attaches to routes of its own namespace only. One route
# taking either credential would also have to stop refusing a request without
# a token at the authentication step (401), which callers rely on.
#
# Install in the namespace that holds the workload keys' ConfigMaps
# (`workload-key-<workload>`, label agentgateway-demo/workload-key=<workload>).
#
# Schema: Agentgateway 1.6, AgentgatewayPolicy `traffic.apiKeyAuthentication`,
# as in agent-platform/profiles/kagent/model-access.

# The workloads that get a route. Each needs a key from mint-key.sh.
workloads: []

# The Gateway the routes attach to.
gateway:
  name: agentgateway-proxy
  namespace: agentgateway-system
  listener: http

# The MCP backend the routes lead to.
backend:
  name: observability-mcp
  namespace: tools
