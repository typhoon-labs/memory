apiVersion: v1
kind: Service
metadata:
  name: {{ include "observability-mcp.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "observability-mcp.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "observability-mcp.selectorLabels" . | nindent 4 }}
  ports:
    - name: mcp
      protocol: TCP
      port: 8000
      targetPort: mcp
