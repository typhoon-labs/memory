# Catalog entry for observability-mcp. Facts from docs/contracts.md
# and agent-deployments/clusters/dev/workloads/observability-mcp/.
#
# `remote`: the server already runs and the registry does not deploy it. The
# URL is the gateway's route for a caller with a Keycloak token, as an agent in
# the cluster reaches it; from the host it is
# http://localhost:18080/mcp/observability.
apiVersion: ar.dev/v1alpha1
kind: MCPServer
metadata:
  name: observability-mcp
  labels:
    built-with: mcp-grafana
    runs-in: tools
    version: 2.0.1
spec:
  title: Observability MCP
  description: >-
    Read-only access to the cluster's metrics, logs and traces: Grafana's MCP
    server in front of Prometheus, Loki and Tempo. Twenty tools, none of which
    writes: PromQL, LogQL and TraceQL queries, the names and values of labels
    and attributes, dashboards and their panel queries, alert rules, and a link
    to open in Grafana. MCP over Streamable HTTP, with a session. Gateway route
    /mcp/observability, for any signed-in caller with a Keycloak token. A
    workload without a user's token uses a route of its own with the key the
    gateway issued to it: diagnosis-agent at
    /workloads/diagnosis-agent/mcp/observability.
  remote:
    type: streamable-http
    url: http://agentgateway-proxy.agentgateway-system.svc.cluster.local/mcp/observability
