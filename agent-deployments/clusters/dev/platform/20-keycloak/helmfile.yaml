# Keycloak with the demo realm. Stands in for Okta; exists only on kind, so the
# chart and the realm live under local/identity/. A second realm, corp, stands
# in for the enterprise IdP that the demo realm brokers: README.md.
commonLabels:
  layer: trunk

# Every helm call names our context, so this file cannot be applied to another
# cluster: with any other kubeconfig the context does not exist and helm fails.
helmDefaults:
  kubeContext: kind-agentgateway-demo

releases:
  - name: keycloak
    namespace: keycloak
    createNamespace: true
    # Local chart: version in its Chart.yaml, Keycloak image pinned by appVersion.
    chart: ../../../../../local/identity/keycloak
    wait: true
    timeout: 420
    hooks:
      # The realm's signing key, made once and kept in a Secret, so that a
      # restarted Keycloak signs with the key the gateway already has. The
      # script names the repo-local kubeconfig and the context itself.
      - events: ["presync"]
        showlogs: true
        command: ../../../../../local/identity/keycloak/scripts/realm-keys.sh
