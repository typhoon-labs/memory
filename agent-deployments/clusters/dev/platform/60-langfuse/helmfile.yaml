# Langfuse: traces of the agents, with the caller's identity and the cost.
# Picked up by ../../helmfile.yaml (platform/*/helmfile.yaml).
#
#   task langfuse:install       this file only
#   task deploy -- -l name=langfuse
#
# One release holds everything: web, worker, PostgreSQL, Valkey, SeaweedFS
# (values.yaml) and a single ClickHouse server (clickhouse.yaml). Langfuse is
# the first thing to drop when memory is short: `task langfuse:uninstall`.
#
# Chart and install steps follow https://langfuse.com/self-hosting/deployment/kubernetes-helm
# and https://github.com/langfuse/langfuse-k8s (Helm 3.17 or later).
commonLabels:
  layer: platform

# Not inherited from the root helmfile. With any other kubeconfig this context
# does not exist, and helm fails before it changes anything.
helmDefaults:
  kubeContext: kind-agentgateway-demo

releases:
  - name: langfuse
    namespace: langfuse
    createNamespace: true
    chart: oci://ghcr.io/langfuse/langfuse-k8s/charts/langfuse
    # Langfuse 4.46.0. Pinning the chart pins the Langfuse images; the
    # ClickHouse image is pinned in clickhouse.yaml.
    version: 2.1.3
    values:
      - values.yaml
      - clickhouse.yaml
    wait: true
    # The first install pulls about 1.3 GB of images and runs every migration:
    # about five minutes here. With the images present, under a minute.
    timeout: 900
    hooks:
      # The Secrets the release reads must exist first. The script names the
      # repo-local kubeconfig and our context itself, and keeps what exists.
      - events: ["presync"]
        showlogs: true
        command: ./init-secrets.sh
