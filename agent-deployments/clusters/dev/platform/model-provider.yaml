# Model provider binding for the dev cluster.
#
# The one place that selects the provider. Agentgateway holds this binding and
# is the only component that talks to the provider. Agents and the chat
# assistant call the gateway's model route with their own bearer token and
# never see these values or a provider key.
#
# Moving to Bedrock for demo day: fill in the `bedrock` block, set
# `active: bedrock`, then `task deploy -- -l name=model-route`.
#
# This is a values file for the release `model-route`
# (platform/30-model-route/helmfile.yaml), rendered by the chart in
# agent-platform/profiles/gateway/model-route/. It is not a Kubernetes resource.

modelProvider:
  active: local              # local | bedrock

  # The model IDs clients send (MODEL_ID and MODEL_ID_FAST in the conventions).
  # They stay the same whatever the provider. The gateway refuses any other
  # model with 403.
  models:
    default: claude-sonnet-5-5
    fast: claude-haiku-4-5-20251001

  # Anthropic Messages API served on the host machine, outside the cluster, at
  # http://localhost:7070/v1/messages.
  local:
    # Inside a pod, "localhost" is the pod itself. This machine runs Docker
    # Desktop, where host.docker.internal is the host. Checked from a pod in
    # this cluster: the name resolves and reaches a listening host port.
    host: host.docker.internal
    port: 7070
    pathPrefix: /v1
    # The endpoint needs the header `anthropic-version: 2023-06-01`. The
    # gateway's Anthropic provider adds it to every upstream request, so
    # nothing is configured for it here.
    #
    # Listing models needs no key. If sending messages needs one, create a
    # Secret in agentgateway-system outside git, with the key under
    # `Authorization`, and name it here. The gateway sends it as x-api-key.
    credentialSecret: ""

  # PLACEHOLDER: Amazon Bedrock, for demo day. Not applied and not verified.
  #
  # What the Agentgateway docs say a Bedrock backend needs
  # (https://agentgateway.dev/docs/kubernetes/latest/integrations/llm/providers/bedrock/):
  #
  # - `spec.ai.provider.bedrock.region`: one region; multiple regions are not
  #   supported. Defaults to us-east-1.
  # - A model ID per request. Cross-region inference profiles carry a region
  #   prefix, such as `us.anthropic.claude-sonnet-4-20250514-v1:0`. The chart
  #   maps the client-facing IDs above to the IDs in `modelIds` with
  #   `policies.ai.modelAliases`, so components keep MODEL_ID unchanged.
  # - Credentials, one of:
  #     a. a Secret with keys `accessKey`, `secretKey` and optionally
  #        `sessionToken`, referenced as `policies.auth.aws.secretRef`
  #        (what `credentialSecret` below renders);
  #     b. a Bedrock API key in a Secret under `Authorization`, referenced as
  #        `policies.auth.secretRef` (the chart would need this variant added);
  #     c. no `auth` block: the proxy pod's ambient AWS credentials, such as
  #        IRSA on EKS. kind has no workload IAM, so use (a) or (b) here.
  # - IAM permission to invoke the chosen models. Requests that go to the
  #   Bedrock "Mantle" endpoint are signed for service `bedrock-mantle`, so an
  #   IAM policy scoped by service name must allow both `bedrock` and
  #   `bedrock-mantle`. `endpointPreference` (default RuntimePreferred) chooses
  #   between the two endpoints.
  # - Nothing changes for clients: the docs state that the gateway translates
  #   between the client format and Bedrock, so /v1/messages and
  #   /v1/chat/completions keep working. Bedrock-native request shapes
  #   (Converse) are not accepted at the client-facing endpoint.
  bedrock:
    region: ""               # TODO
    # Kubernetes Secret in agentgateway-system, created outside git.
    credentialSecret: ""     # TODO
    # Client-facing model ID -> Bedrock model or inference profile ID.
    modelIds:
      claude-sonnet-5-5: ""            # TODO
      claude-haiku-4-5-20251001: ""    # TODO
