# Who may call the gateway's model route.
#
# Values for the release `model-route-auth` (helmfile.yaml, next to this
# file). Who may call the other routes is in ../../domains/.
#
# Which models a caller may use is not decided here: the approved model IDs are
# `modelProvider.models` in model-provider.yaml, next to this file.
target:
  name: model

# CEL expressions on the verified token; any one that is true allows the call.
# Empty: every caller with a valid token, human or machine: a Keycloak token
# for audience `agentgateway`, or chain-sts's for this route. To limit the
# route to some roles, list them, for example:
#   - '"developer" in jwt.roles'
#   - '"alert-automation" in jwt.roles'
allow: []

# The target chain-sts's tokens must be for (`delegation.resources` in
# ../../identity.yaml): <gateway>/v1. A token an agent got for another route,
# the one it was called with included, is refused here (401). The gateway
# removes the token before it calls the model.
resource: model

# Which agent may call it on a user's behalf: the three that exchange their
# caller's token at chain-sts and then ask the model, each as the newest
# actor of its own token: chat-assistant for a chat answer,
# remediation-agent for its report and comms-agent for its draft. A caller's
# own token, without `act` (`task smoke`), is decided by `allow` alone.
# diagnosis-agent reaches the model with its gateway key on a route of its
# own (the release diagnosis-agent-model-access), which this does not touch.
actors:
  - chat-assistant
  - remediation-agent
  - comms-agent
