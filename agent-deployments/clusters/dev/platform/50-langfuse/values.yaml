# Langfuse in its smallest working shape: one replica of everything, small
# requests, small volumes. Values for the chart langfuse 2.1.3 (Langfuse
# 4.46.0); the keys are the chart's own, see its README at
# https://github.com/langfuse/langfuse-k8s/tree/langfuse-2.1.3
#
# Credentials are not in this file. `scripts/init-secrets.sh` creates them in the
# cluster before the chart is installed; the chart generates the rest
# (PostgreSQL, Valkey, SeaweedFS, salt, encryption key) on first install and
# keeps them across upgrades.
#
# Retention: a retention period per project needs the Enterprise Edition on a
# self-hosted Langfuse (https://langfuse.com/docs/administration/data-retention),
# so LANGFUSE_INIT_PROJECT_RETENTION is not set. What the demo writes is small,
# and `task langfuse:uninstall` removes all of it.
#
# ClickHouse is in clickhouse.yaml.

langfuse:
  # The chart's default is Always, which needs the registry at every restart.
  image:
    pullPolicy: IfNotPresent
  revisionHistoryLimit: 1

  nextauth:
    # The address a browser on the host uses (NodePort 30085).
    url: http://localhost:18085

  features:
    # No usage statistics to langfuse.com, and nobody signs up: the one user
    # comes from the headless initialization below.
    telemetryEnabled: false
    signUpDisabled: true

  # Web and worker exit when a store is not there yet, and Kubernetes restarts
  # them with a growing delay. Waiting first lets a cold install finish sooner
  # and without restarts. The image is PostgreSQL's, pulled for the database
  # anyway.
  extraInitContainers:
    - name: wait-for-stores
      image: docker.io/postgres:18
      imagePullPolicy: IfNotPresent
      command:
        - bash
        - -c
        - |
          until pg_isready --quiet --host langfuse-postgresql --port 5432; do sleep 2; done
          until (exec 3<>/dev/tcp/langfuse-clickhouse/8123) 2>/dev/null; do sleep 2; done
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          memory: 64Mi

  web:
    service:
      type: NodePort
      nodePort: 30085
    pdb:
      create: false
    pod:
      # Headless initialization: organization, project, project keys and the
      # admin user, read once at start-up. An object that exists is left alone.
      # https://langfuse.com/self-hosting/administration/headless-initialization
      additionalEnvFrom:
        - secretRef:
            name: langfuse-init
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 1536Mi

  worker:
    pdb:
      create: false
    resources:
      requests:
        cpu: 100m
        memory: 384Mi
      limits:
        memory: 1536Mi

postgresql:
  storage:
    requestedSize: 2Gi
    # Removing the release removes the data.
    persistentVolumeClaimRetentionPolicy:
      whenDeleted: Delete
      whenScaled: Retain
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi

# Valkey: the queue between web and worker.
redis:
  dataStorage:
    requestedSize: 1Gi
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      memory: 256Mi

# SeaweedFS, all in one pod: every ingested event is written here first.
s3:
  global:
    seaweedfs:
      # The sub-chart's default is a ClusterRole that may create and delete
      # pods in every namespace, for a master migration this shape never does.
      createClusterRole: false
  allInOne:
    data:
      size: 2Gi
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: "1"
        memory: 512Mi
