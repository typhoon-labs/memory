# The controls that make going around the gateway fail.
# Picked up by ../../helmfile.yaml (platform/*/helmfile.yaml).
#
#   agents-network-boundary   agents    NetworkPolicy: only the gateway calls an
#   tools-network-boundary    tools     agent or a tool server, and they reach
#                                       only the gateway and what they need
#   kyverno                   kyverno   Kyverno's admission controller, alone
#   gateway-rules             kyverno   admission rules: a gateway policy, route
#                                       or backend from outside the platform's
#                                       releases cannot weaken or go around a
#                                       platform route
#
# The rules are in agent-platform/policies/; what this cluster allows beyond
# them, and why, is in the values files next to this file.
#
# Apply one release at a time:
#   task deploy -- -l name=tools-network-boundary
#
# Check that each control refuses the direct path and lets the governed one
# through: agent-platform/tests/ (`task demo:backup:bypass-tool` and the other
# backup tasks run them).
#
# The two boundary releases create their namespace if it is missing, so that on
# a new cluster the boundary is there before the first workload starts.
commonLabels:
  layer: policies

# Not inherited from the root helmfile. With any other kubeconfig this context
# does not exist, and helm fails before it changes anything.
helmDefaults:
  kubeContext: kind-agentgateway-demo

releases:
  - name: agents-network-boundary
    namespace: agents
    createNamespace: true
    chart: ../../../../../agent-platform/policies/network/workload-boundary
    values:
      - agents-network.yaml.gotmpl

  - name: tools-network-boundary
    namespace: tools
    createNamespace: true
    chart: ../../../../../agent-platform/policies/network/workload-boundary
    values:
      - tools-network.yaml.gotmpl

  # Kyverno's admission controller, alone. Measured on this cluster: its pod
  # holds 70 MiB idle and 100 MiB after use; the node as a whole grew by about
  # 0.5 GiB in the five minutes around the install, which includes the API
  # server taking in Kyverno's 22 resource kinds.
  - name: kyverno
    namespace: kyverno
    createNamespace: true
    chart: oci://ghcr.io/kyverno/charts/kyverno
    # Kyverno v1.19.1.
    version: 3.9.1
    values:
      - ../../../../../agent-platform/policies/kyverno/install-values.yaml
    wait: true
    timeout: 300

  # What a gateway policy, route or backend may not do unless it is part of a
  # platform release. Needs Kyverno's resource kinds, so apply `kyverno` first.
  - name: gateway-rules
    namespace: kyverno
    chart: ../../../../../agent-platform/policies/kyverno/gateway-rules
    needs:
      - kyverno/kyverno
    values:
      - gateway-rules.yaml
    hooks:
      # Kyverno's pod is Ready before its policy webhook answers, and a policy
      # applied in between is refused. The script waits for the webhook; it
      # names the repo-local kubeconfig and the context itself.
      - events: ["presync"]
        showlogs: true
        command: ./scripts/wait-kyverno.sh
