{{- if or .Values.cors .Values.timeouts }}
{{- $name := required "route.name" .Values.route.name -}}
# How the gateway treats traffic on this route, apart from who may call it
# (that is the route-auth release's policy on the same HTTPRoute).
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: {{ $name }}-traffic
  namespace: {{ .Release.Namespace }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: {{ $name }}
  traffic:
    {{- with .Values.cors }}
    cors:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with .Values.timeouts }}
    timeouts:
      {{- toYaml . | nindent 6 }}
    {{- end }}
{{- end }}
