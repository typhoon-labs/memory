{{- $name := required "route.name" .Values.route.name -}}
{{- if not .Values.route.paths }}
{{- fail "route.paths: list at least one path" }}
{{- end }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
    - name: {{ .Values.gateway.name }}
      namespace: {{ .Values.gateway.namespace }}
      sectionName: {{ .Values.gateway.listener }}
  rules:
    {{- range .Values.route.paths }}
    - matches:
        - path:
            type: PathPrefix
            value: {{ required "route.paths[].path" .path | quote }}
          {{- with .method }}
          method: {{ . }}
          {{- end }}
      {{- if ne .path (.backendPath | default .path) }}
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: {{ .backendPath | quote }}
      {{- end }}
      backendRefs:
        - name: {{ required "backend.service" $.Values.backend.service }}
          port: {{ $.Values.backend.port }}
    {{- end }}
