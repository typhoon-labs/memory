# Observability for the dev cluster, in namespace `telemetry`.
# Picked up by ../../helmfile.yaml (platform/*/helmfile.yaml).
#
#   kube-prometheus-stack   Prometheus, Alertmanager, Grafana and the operator
#   loki                    logs
#   tempo                   traces
#   otel-collector          the one OTLP receiver; forwards to Tempo and Loki,
#                           and to Langfuse when switched on
#   gateway-telemetry       the gateway's traces and access logs, to the collector
#   observability-content   dashboards, the scrape of the Sample App, its alert
#                           rule, and the route from Alertmanager to the alert hook
#
# Apply one release at a time, in the order listed:
#   task deploy -- -l name=<release>
# or all of them, in order, with `task observability:install`.
#
# What other workstreams decide (the alert's target, the Langfuse switch) is in
# settings.yaml. Grafana, Prometheus, Alertmanager, Loki and Tempo stand in for
# the organisation's operational backend, so their values are in
# local/observability/stack/. The collector and the gateway's telemetry policy
# would exist in production too, so theirs are here.
#
# Chart versions are the ones the Agentgateway 1.6 guide installs:
# https://agentgateway.dev/docs/kubernetes/latest/documentation/observability/otel-stack/
# All four charts are pulled as OCI artifacts, so no Helm repository is added
# to this machine's Helm configuration.
environments:
  default:
    values:
      - settings.yaml
---
commonLabels:
  layer: platform

# Not inherited from the root helmfile. With any other kubeconfig this context
# does not exist, and helm fails before it changes anything.
helmDefaults:
  kubeContext: kind-agentgateway-demo

releases:
  # Also installs the Prometheus Operator CRDs (ServiceMonitor, PodMonitor,
  # PrometheusRule, AlertmanagerConfig), which later releases here and the
  # Agentgateway chart's monitoring resources need.
  - name: kube-prometheus-stack
    namespace: telemetry
    createNamespace: true
    chart: oci://ghcr.io/prometheus-community/charts/kube-prometheus-stack
    version: 75.6.1
    values:
      - ../../../../../local/observability/stack/kube-prometheus-stack.yaml
    wait: true
    timeout: 600

  - name: loki
    namespace: telemetry
    createNamespace: true
    chart: oci://ghcr.io/grafana-community/helm-charts/loki
    version: 6.24.0
    values:
      - ../../../../../local/observability/stack/loki.yaml
    wait: true
    timeout: 300

  - name: tempo
    namespace: telemetry
    createNamespace: true
    chart: oci://ghcr.io/grafana-community/helm-charts/tempo
    version: 1.16.0
    values:
      - ../../../../../local/observability/stack/tempo.yaml
    wait: true
    timeout: 300

  # Creates a ServiceMonitor, so it comes after kube-prometheus-stack.
  - name: otel-collector
    namespace: telemetry
    createNamespace: true
    chart: oci://ghcr.io/open-telemetry/opentelemetry-helm-charts/opentelemetry-collector
    version: 0.127.2
    needs:
      - telemetry/kube-prometheus-stack
    values:
      - collector.yaml.gotmpl
    wait: true
    timeout: 300

  # After the collector, so the gateway never exports to a Service that does
  # not exist. A local chart, version in gateway-telemetry/Chart.yaml.
  - name: gateway-telemetry
    namespace: agentgateway-system
    chart: ./gateway-telemetry
    needs:
      - telemetry/otel-collector
    values:
      - gateway-telemetry.yaml.gotmpl

  # Dashboards, the Sample App's ServiceMonitor, alert rules and the
  # Alertmanager route: the chart is local/observability itself. The hook
  # creates the Secret the route reads the machine client's credentials from;
  # it names the kubeconfig and the context itself.
  - name: observability-content
    namespace: telemetry
    chart: ../../../../../local/observability
    needs:
      - telemetry/kube-prometheus-stack
    values:
      - content.yaml.gotmpl
    hooks:
      - events: ["presync"]
        showlogs: true
        command: ../../../../../local/observability/scripts/alert-secret.sh
