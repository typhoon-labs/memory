# comms-agent behind the gateway: where it is reached and who may call it.
#
#   from a pod      http://agentgateway-proxy.agentgateway-system.svc.cluster.local/a2a/comms-agent
#   from the host   http://localhost:18080/a2a/comms-agent
#
# Values for two releases in the helmfile.yaml next to this file:
# `comms-agent-route` (route, backend) and `comms-agent-route-auth`
# (allow, passthrough).

route:
  name: comms-agent
  path: /a2a/comms-agent

backend:
  host: comms-agent.agents.svc.cluster.local
  port: 8080

# Who may call the agent, its agent card included: CEL expressions on the
# verified token, any one of which allows the caller. The agent drafts a
# status update, which is the incident manager's to post.
allow:
  - '"incident-manager" in jwt.roles'

# Who may call it on a user's behalf: only chat-assistant, which hands it an
# incident manager's Draft button (chain [chat-assistant]). An incident
# manager calling it directly sends their own token, without `act`.
actors:
  - chat-assistant

# The gateway passes the caller's token on. The agent exchanges it at
# chain-sts for one that adds comms-agent to `act`, and reads the incident
# from delivery-mcp and calls the model route with that one only.
passthrough: true
