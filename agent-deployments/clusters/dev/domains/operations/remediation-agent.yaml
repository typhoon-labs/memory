# remediation-agent behind the gateway: where it is reached and who may call it.
#
#   from a pod      http://agentgateway-proxy.agentgateway-system.svc.cluster.local/a2a/remediation-agent
#   from the host   http://localhost:18080/a2a/remediation-agent
#
# Values for two releases in the helmfile.yaml next to this file:
# `remediation-agent-route` (route, backend) and `remediation-agent-route-auth`
# (allow, passthrough).

route:
  name: remediation-agent
  path: /a2a/remediation-agent

backend:
  host: remediation-agent.agents.svc.cluster.local
  port: 8080

# Who may call the agent, its agent card included: CEL expressions on the
# verified token, any one of which allows the caller. The agent applies a
# change, which only a platform engineer may do.
allow:
  - '"platform-engineer" in jwt.roles'

# Who may call it on a user's behalf: only chat-assistant, which hands it a
# platform engineer's Apply button with a token chain-sts issued
# (chain [chat-assistant]). A platform engineer calling it directly sends
# their own token, without `act`, which `allow` alone decides. A token whose
# newest actor is another agent, or remediation-agent itself, is refused.
actors:
  - chat-assistant

# The gateway passes the caller's token on. The agent exchanges it at
# chain-sts for one that adds remediation-agent to `act`, and calls
# delivery-mcp and the model route with that one only.
passthrough: true
