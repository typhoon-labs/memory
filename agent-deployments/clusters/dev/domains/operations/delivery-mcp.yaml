# delivery-mcp behind the gateway: where it is reached, who may call it, and
# which role may use which tool.
#
#   from a pod      http://agentgateway-proxy.agentgateway-system.svc.cluster.local/mcp/delivery
#   from the host   http://localhost:18080/mcp/delivery
#
# Values for two releases in ../../platform/80-routes/helmfile.yaml:
# `delivery-mcp-route` (route, backend, tools) and `delivery-mcp-route-auth`
# (allow, passthrough). Apply a change with
# `task deploy -- -l name=delivery-mcp-route` or `-l name=delivery-mcp-route-auth`.

route:
  name: delivery-mcp
  path: /mcp/delivery

backend:
  # Service `delivery-mcp` in namespace `tools`, MCP over Streamable HTTP at /mcp.
  service: delivery-mcp
  port: 8080

# Who may open an MCP session at all: CEL expressions on the verified token,
# any one of which allows the caller. Empty: anyone with a valid token for
# audience `agentgateway`. What they may do then is the table below.
allow: []

# delivery-mcp receives the caller's own token. It checks every role again and
# applies the rules only it can know (team ownership, approval, and so on).
passthrough: true

# Tool -> the roles that may see it in tools/list and call it. "*" is any
# signed-in caller. This mirrors the tool table in
# agent-platform/docs/conventions.md; a tool that is not listed here is hidden
# from everyone, so a new tool needs a line before anyone can call it.
tools:
  list_incidents: ["*"]
  get_incident: ["*"]
  open_incident: [alert-automation]
  record_diagnosis: [alert-automation]
  propose_change: [developer]
  approve_change: [incident-manager]
  reject_change: [incident-manager]
  post_status_update: [incident-manager]
  apply_change: [platform-engineer]
  restart_workload: [platform-engineer]
