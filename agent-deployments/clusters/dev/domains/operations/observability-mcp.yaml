# observability-mcp behind the gateway: where it is reached, who may call it,
# and which tools callers see.
#
#   from a pod      http://agentgateway-proxy.agentgateway-system.svc.cluster.local/mcp/observability
#   from the host   http://localhost:18080/mcp/observability
#
# Values for two releases in ../../workloads/observability-mcp/helmfile.yaml,
# not in the helmfile next to this file, because the server's own chart
# renders its route:
#
#   observability-mcp                   route.path, allowedTools
#   observability-mcp-workload-access   route.path, workloads
#
# Any caller with a valid token for audience `agentgateway` may open a session;
# there is no rule by role, because every tool only reads. The caller's token
# stops at the gateway: the server reads Grafana with its own Viewer
# credential, the same for every caller.

route:
  path: /mcp/observability

# Workloads that cannot present a user's token and come in with the key the
# gateway issued to them instead (agent-platform/profiles/kagent/tool-access).
# Each gets a door of its own, /workloads/<workload>/mcp/observability:
#
#   diagnosis-agent   http://agentgateway-proxy.agentgateway-system.svc/workloads/diagnosis-agent/mcp/observability
workloads:
  - diagnosis-agent

# The tools callers see, out of the 33 read tools the server registers with the
# categories above (mcp-grafana 2.0.1, checked with tools/list). Kept short on
# purpose: every listed tool's description is sent to the model on each turn.
# All of them only read. Left out: label and trace analysis helpers, dashboard
# versions and full dashboard JSON, folders, silences, and
# `alerting_manage_routing`.
allowedTools:
  # Data sources: their uids are prometheus, loki and tempo.
  - list_datasources
  - get_datasource
  # Metrics (PromQL)
  - query_prometheus
  - query_prometheus_histogram
  - list_prometheus_metric_names
  - list_prometheus_label_names
  - list_prometheus_label_values
  # Logs (LogQL)
  - query_loki_logs
  - query_loki_stats
  - list_loki_label_names
  - list_loki_label_values
  # Traces (TraceQL)
  - search_tempo_traces
  - get_tempo_trace
  - list_tempo_attribute_names
  - list_tempo_attribute_values
  # Dashboards and alert rules
  - search_dashboards
  - get_dashboard_summary
  - get_dashboard_panel_queries
  - alerting_rules_read
  # A link to Grafana that a person can open, as evidence
  - generate_deeplink
