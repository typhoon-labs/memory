services:
  # ==========================================================================
  # PostgreSQL + pgvector
  # ==========================================================================
  postgres:
    profiles: [all, infra]
    image: pgvector/pgvector:pg17
    container_name: typhoon-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: typhoon
      POSTGRES_PASSWORD: typhoon
      POSTGRES_DB: typhoon
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-postgres.sql:/docker-entrypoint-initdb.d/init-postgres.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U typhoon']
      interval: 5s
      timeout: 5s
      retries: 5

  # ==========================================================================
  # Redis
  # ==========================================================================
  redis:
    profiles: [all, infra]
    image: redis:8-alpine
    container_name: typhoon-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  # ==========================================================================
  # MinIO (S3-compatible object storage)
  # ==========================================================================
  minio:
    profiles: [all, infra]
    image: minio/minio:latest
    container_name: typhoon-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_PROMETHEUS_AUTH_TYPE: public
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 5

  # Create default bucket on startup
  minio-init:
    profiles: [all, infra]
    image: minio/mc:latest
    container_name: typhoon-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/typhoon-documents &&
      echo 'Bucket typhoon-documents created.'
      "

  # ==========================================================================
  # Bifrost (LLM gateway proxy)
  # ==========================================================================
  bifrost:
    profiles: [all, infra]
    image: maximhq/bifrost:v1.5.0
    container_name: typhoon-bifrost
    restart: unless-stopped
    ports:
      - '${BIFROST_PORT:-8787}:8787'
    environment:
      APP_PORT: 8787
      BIFROST_LOG_LEVEL: ${BIFROST_LOG_LEVEL:-info}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-change-me}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
    volumes:
      - ./bifrost/config.json:/app/data/config.json:ro
      - bifrost_data:/app/data

  # ==========================================================================
  # Dex (OIDC provider — optional, for local SSO testing)
  # ==========================================================================
  dex:
    profiles: [all, infra]
    image: dexidp/dex:v2.45.1
    container_name: typhoon-dex
    restart: unless-stopped
    ports:
      - '5556:5556'
    env_file:
      - ../../.env
    volumes:
      - ./dex/config.yml:/etc/dex/config.template.yaml
    entrypoint:
      - sh
      - -c
      - |
        sed -e "s|__ISSUER__|$${OIDC_ISSUER_URL:-http://host.docker.internal:5556/dex}|g" \
            -e "s|__AUTH_URL__|$${AUTH_URL:-http://localhost:5172}|g" \
            /etc/dex/config.template.yaml > /etc/dex/config.yaml
        exec dex serve /etc/dex/config.yaml

  # ==========================================================================
  # Application services
  # ==========================================================================

  # Database migrations (runs once, then exits)
  migrate:
    profiles: [all, app, migrate]
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
      target: api
    container_name: typhoon-migrate
    command: ['sh', '-c', 'cd packages/db && bun run db:migrate']
    env_file:
      - ../../.env
    environment:
      DATABASE_URL: postgresql://typhoon:typhoon@postgres:5432/typhoon
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  # API Server
  api:
    profiles: [all, app]
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
      target: api
    container_name: typhoon-api
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      # Database & cache
      DATABASE_URL: postgresql://typhoon:typhoon@postgres:5432/typhoon
      REDIS_URL: redis://redis:6379
      # S3 / MinIO
      S3_ENDPOINT: http://minio:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-typhoon-documents}
      # LLM
      LLM_BASE_URL: ${LLM_BASE_URL:-http://bifrost:8787/v1}
      LLM_API_KEY: ${LLM_API_KEY:-changeme}
      LLM_CHAT_MODEL: ${LLM_CHAT_MODEL:-bedrock/us.anthropic.claude-sonnet-4-6}
      LLM_TITLE_MODEL: ${LLM_TITLE_MODEL:-bedrock/us.anthropic.claude-haiku-4-5-20251001-v1:0}
      RERANKER_MODEL: ${RERANKER_MODEL:-bedrock/arn:aws:bedrock:us-east-1::foundation-model/cohere.rerank-v3-5:0}
      RERANKER_BASE_URL: ${RERANKER_BASE_URL:-http://bifrost:8787/v1}
      LLM_EXTRACTION_MODEL: ${LLM_EXTRACTION_MODEL:-bedrock/us.anthropic.claude-haiku-4-5-20251001-v1:0}
      LLM_GUARDRAIL_MODEL: ${LLM_GUARDRAIL_MODEL:-bedrock/us.anthropic.claude-haiku-4-5-20251001-v1:0}
      LLM_KNOWLEDGE_MODEL: ${LLM_KNOWLEDGE_MODEL:-bedrock/us.anthropic.claude-sonnet-4-6}
      LLM_CITATION_MODEL: ${LLM_CITATION_MODEL:-bedrock/us.anthropic.claude-sonnet-4-6}
      LLM_SCORING_MODEL: ${LLM_SCORING_MODEL:-bedrock/us.anthropic.claude-haiku-4-5-20251001-v1:0}
      LLM_SCORING_MODEL_OPTIONS: ${LLM_SCORING_MODEL_OPTIONS:-bedrock/us.anthropic.claude-haiku-4-5-20251001-v1:0,bedrock/us.anthropic.claude-sonnet-4-6}
      # Embeddings
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-http://bifrost:8787/v1}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-bedrock}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-bedrock/amazon.titan-embed-text-v2:0}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-1024}
      EMBEDDING_MAX_CHARS: ${EMBEDDING_MAX_CHARS:-50000}
      EMBEDDING_MAX_TOKENS: ${EMBEDDING_MAX_TOKENS:-8192}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-1}
      # Auth
      AUTH_SECRET: ${AUTH_SECRET:-change-me-in-production}
      AUTH_URL: ${AUTH_URL:-http://localhost:5172}
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-http://localhost:5173,http://localhost:5174}
      # OIDC — ISSUER_URL is what the browser sees (must be reachable from host);
      # BACKCHANNEL_URL is how the server reaches the IdP from inside the compose network.
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-http://localhost:5556/dex}
      OIDC_BACKCHANNEL_URL: ${OIDC_BACKCHANNEL_URL:-http://dex:5556/dex}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-typhoon}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-typhoon-secret}
      # Role mapping
      ADMIN_ROLES: ${ADMIN_ROLES:-admin}
      REP_ROLES: ${REP_ROLES:-rep}
      # Server
      PORT: '${SERVER_PORT:-5172}'
      HOST: 0.0.0.0
      LOG_LEVEL: ${LOG_LEVEL:-info}
      NODE_ENV: production
      # OpenTelemetry
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4318
      OTEL_SERVICE_NAME: typhoon-api
    ports:
      - '${SERVER_PORT:-5172}:${SERVER_PORT:-5172}'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'wget', '-qO/dev/null', 'http://127.0.0.1:${SERVER_PORT:-5172}/api/v1/auth/ok']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # Worker (BullMQ job consumer)
  worker:
    profiles: [all, app]
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
      target: worker
    container_name: typhoon-worker
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      DATABASE_URL: postgresql://typhoon:typhoon@postgres:5432/typhoon
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-typhoon-documents}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://bifrost:8787/v1}
      LLM_API_KEY: ${LLM_API_KEY:-changeme}
      LLM_CHAT_MODEL: ${LLM_CHAT_MODEL:-bedrock/us.anthropic.claude-sonnet-4-6}
      LLM_EXTRACTION_MODEL: ${LLM_EXTRACTION_MODEL:-bedrock/us.anthropic.claude-haiku-4-5-20251001-v1:0}
      LLM_SCORING_MODEL: ${LLM_SCORING_MODEL:-bedrock/us.anthropic.claude-haiku-4-5-20251001-v1:0}
      LLM_SCORING_MODEL_OPTIONS: ${LLM_SCORING_MODEL_OPTIONS:-bedrock/us.anthropic.claude-haiku-4-5-20251001-v1:0,bedrock/us.anthropic.claude-sonnet-4-6}
      LLM_KNOWLEDGE_MODEL: ${LLM_KNOWLEDGE_MODEL:-bedrock/us.anthropic.claude-sonnet-4-6}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-http://bifrost:8787/v1}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-bedrock}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-bedrock/amazon.titan-embed-text-v2:0}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-1024}
      EMBEDDING_MAX_CHARS: ${EMBEDDING_MAX_CHARS:-50000}
      EMBEDDING_MAX_TOKENS: ${EMBEDDING_MAX_TOKENS:-8192}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-1}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SYNC_WORKER_CONCURRENCY: ${SYNC_WORKER_CONCURRENCY:-5}
      NODE_ENV: production
      # OpenTelemetry
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4318
      OTEL_SERVICE_NAME: typhoon-worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Scheduler (cron job producer)
  scheduler:
    profiles: [all, app]
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
      target: scheduler
    container_name: typhoon-scheduler
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      DATABASE_URL: postgresql://typhoon:typhoon@postgres:5432/typhoon
      REDIS_URL: redis://redis:6379
      LOG_LEVEL: ${LOG_LEVEL:-info}
      NODE_ENV: production
      # OpenTelemetry
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4318
      OTEL_SERVICE_NAME: typhoon-scheduler
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Desk (rep workspace SPA)
  desk:
    profiles: [all, app]
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
      target: frontend
      args:
        APP_NAME: desk
    container_name: typhoon-desk
    restart: unless-stopped
    ports:
      - '5173:80'
    depends_on:
      api:
        condition: service_healthy

  # Admin (admin dashboard SPA)
  admin:
    profiles: [all, app]
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
      target: frontend
      args:
        APP_NAME: admin
    container_name: typhoon-admin
    restart: unless-stopped
    ports:
      - '5174:80'
    depends_on:
      api:
        condition: service_healthy

  # Widget (embeddable chat widget)
  widget:
    profiles: [all, app]
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
      target: frontend
      args:
        APP_NAME: widget
    container_name: typhoon-widget
    restart: unless-stopped
    ports:
      - '5175:80'

  # ==========================================================================
  # Observability (LGTM stack)
  # ==========================================================================

  # All-in-one Grafana + Loki + Tempo + Prometheus + OTel Collector.
  # The internal collector config is overridden to include PostgreSQL/Redis
  # receivers, Prometheus scrape, spanmetrics connector, and filelog for
  # Docker container logs — replacing postgres-exporter, redis-exporter,
  # otel-collector, and promtail as separate containers.
  otel-lgtm:
    profiles: [all, observability]
    image: grafana/otel-lgtm:latest
    container_name: typhoon-otel-lgtm
    restart: unless-stopped
    ports:
      - '3000:3000'
      - '4317:4317'
      - '4318:4318'
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      # Override internal collector config with our consolidated config
      - ./otel/otel-collector-config.yaml:/otel-lgtm/otelcol-config.yaml:ro
      # Docker container logs for filelog receiver (replaces promtail)
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      # Provisioning: otel-lgtm reads from /otel-lgtm/grafana/conf/provisioning/ (not /etc/grafana/provisioning/)
      - ./grafana/provisioning/dashboards/dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/dashboards.yaml:ro
      - ./grafana/provisioning/dashboards/grafana-dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/grafana-dashboards.yaml:ro
      - ./grafana/provisioning/datasources/datasources.yaml:/otel-lgtm/grafana/conf/provisioning/datasources/datasources.yaml:ro
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  minio_data:
  bifrost_data:
  grafana_data:
