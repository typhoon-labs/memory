# Dex configuration for local OIDC testing.
# Start with: docker compose --profile oidc up dex
issuer: http://localhost:5556/dex

storage:
  type: sqlite3
  config:
    file: /var/dex/dex.db

web:
  http: 0.0.0.0:5556

oauth2:
  skipApprovalScreen: true

staticClients:
  - id: typhoon
    name: Typhoon
    secret: typhoon-secret
    redirectURIs:
      - http://localhost:5172/v1/auth/oauth2/callback/oidc

enablePasswordDB: true

staticPasswords:
  - email: admin@typhoon.local
    hash: '$2a$10$2b2cU8CPhOTaGrs1HRQuAueS7JTT5ZHsHSzYiFPm1leZck7Mc8T4W' # password
    username: admin
    userID: 00000000-0000-0000-0000-000000000001
