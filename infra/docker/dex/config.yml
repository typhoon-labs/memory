# Dex configuration for local OIDC testing.
# Placeholders are substituted at startup via the docker-compose entrypoint
# using OIDC_ISSUER_URL and AUTH_URL from .env.
issuer: __ISSUER__

storage:
  type: sqlite3
  config:
    file: /var/dex/dex.db

web:
  http: 0.0.0.0:5556

telemetry:
  http: 0.0.0.0:5557

oauth2:
  skipApprovalScreen: true

staticClients:
  - id: typhoon
    name: Typhoon
    secret: typhoon-secret
    redirectURIs:
      - __AUTH_URL__/v1/auth/oauth2/callback/oidc

enablePasswordDB: true

staticPasswords:
  - email: admin@typhoon.local
    hash: '$2a$10$2b2cU8CPhOTaGrs1HRQuAueS7JTT5ZHsHSzYiFPm1leZck7Mc8T4W' # password
    username: admin
    userID: 00000000-0000-0000-0000-000000000001
    groups:
      - admin
  - email: rep@typhoon.local
    hash: '$2a$10$2b2cU8CPhOTaGrs1HRQuAueS7JTT5ZHsHSzYiFPm1leZck7Mc8T4W' # password
    username: rep
    userID: 00000000-0000-0000-0000-000000000002
    groups:
      - rep
