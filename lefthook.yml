pre-commit:
  parallel: true
  commands:
    format-check:
      glob: '*.{ts,tsx,js,jsx,json,css}'
      run: bunx oxfmt --check --no-error-on-unmatched-pattern {staged_files}
    lint:
      glob: '*.{ts,tsx,js,jsx}'
      run: bunx oxlint {staged_files}

pre-push:
  commands:
    typecheck:
      run: bun run typecheck
