image:
  repository: quay.io/keycloak/keycloak
  # Empty uses the chart's appVersion.
  tag: ""

# The address browsers use, and therefore the issuer in every token:
# <publicUrl>/realms/demo. Host port 18081 maps to NodePort 30081.
publicUrl: http://localhost:18081
nodePort: 30081

# Small on purpose: one pod, development mode, in-memory H2 database. The realm
# is imported again on every pod start, so nothing persists and nothing drifts.
resources:
  requests:
    cpu: 100m
    memory: 384Mi
  limits:
    memory: 768Mi
javaHeap: "-Xms128m -Xmx384m"

# Features beyond Keycloak's defaults, with their versions, so that an upgrade
# cannot switch a feature's version underneath.
features:
  - opentelemetry-logs:v1

# Keycloak's log, sign-in and admin events included, to the cluster's
# collector over OTLP (preview feature opentelemetry-logs:v1 above, in
# Keycloak since 26.5), and from there to Loki. The realm turns events on and
# names the `jboss-logging` listener, which writes each event as a log line;
# `eventsSuccessLevel` makes successful events INFO, so that they are exported
# (Keycloak's default is DEBUG). Admin events are kept without their
# representations, which could carry secrets.
# https://www.keycloak.org/observability/telemetry
telemetry:
  endpoint: http://otel-collector.telemetry.svc.cluster.local:4317
  logsLevel: info
  eventsSuccessLevel: info
