{{- /*
The admin console password is generated in the cluster and never written to a
tracked file. It is kept across upgrades. Read it with:
  kubectl -n keycloak get secret keycloak-admin -o jsonpath='{.data.password}' | base64 -d
*/ -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace "keycloak-admin" -}}
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-admin
  namespace: {{ .Release.Namespace }}
type: Opaque
data:
  username: {{ "admin" | b64enc }}
  {{- if and $existing $existing.data (index $existing.data "password") }}
  password: {{ index $existing.data "password" }}
  {{- else }}
  password: {{ randAlphaNum 24 | b64enc }}
  {{- end }}
