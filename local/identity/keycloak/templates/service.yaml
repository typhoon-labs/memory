# From the host:      http://localhost:18081
# From inside a pod:  http://keycloak.keycloak.svc.cluster.local:8080
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: keycloak
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: keycloak
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: {{ .Values.nodePort }}
