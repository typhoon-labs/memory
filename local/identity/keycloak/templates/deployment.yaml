apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: keycloak
spec:
  replicas: 1
  # The database lives in the pod, so never run two pods side by side.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: keycloak
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak
      annotations:
        # A change to any realm file restarts the pod, which imports them
        # again: the hash covers the whole ConfigMap, every files/*-realm.json.
        checksum/realm: {{ include (print $.Template.BasePath "/realm-configmap.yaml") . | sha256sum }}
    spec:
      containers:
        - name: keycloak
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          args: ["start-dev", "--import-realm"]
          env:
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              valueFrom:
                secretKeyRef: { name: keycloak-admin, key: username }
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: { name: keycloak-admin, key: password }
            # A full URL fixes the issuer, whatever address a request arrives on.
            - name: KC_HOSTNAME
              value: {{ .Values.publicUrl | quote }}
            # In-cluster callers use the Service address for the token and key
            # endpoints. The issuer inside the tokens stays the public URL.
            - name: KC_HOSTNAME_BACKCHANNEL_DYNAMIC
              value: "true"
            - name: KC_HTTP_ENABLED
              value: "true"
            - name: KC_HEALTH_ENABLED
              value: "true"
            - name: KC_CACHE
              value: local
            {{- with .Values.features }}
            - name: KC_FEATURES
              value: {{ join "," . | quote }}
            {{- end }}
            {{- with .Values.telemetry }}
            # Keycloak's log, sign-in and admin events included, to the cluster's
            # collector over OTLP; see values.yaml.
            - name: KC_TELEMETRY_LOGS_ENABLED
              value: "true"
            - name: KC_TELEMETRY_ENDPOINT
              value: {{ .endpoint | quote }}
            - name: KC_TELEMETRY_LOGS_LEVEL
              value: {{ .logsLevel | quote }}
            - name: KC_SPI_EVENTS_LISTENER__JBOSS_LOGGING__SUCCESS_LEVEL
              value: {{ .eventsSuccessLevel | quote }}
            {{- end }}
            - name: JAVA_OPTS_KC_HEAP
              value: {{ .Values.javaHeap | quote }}
            # Each realm's signing key, so that a restart keeps it: realm file
            # files/<realm>-realm.json reads it as ${KC_REALM_<REALM>_SIGNING_KEY}
            # and _CERT (component `stable-rs256`). Secret keycloak-realm-keys is
            # made by scripts/realm-keys.sh before each sync, from the same list
            # of files.
            {{- range $path, $_ := .Files.Glob "files/*-realm.json" }}
            {{- $realm := base $path | trimSuffix "-realm.json" }}
            - name: KC_REALM_{{ upper $realm }}_SIGNING_KEY
              valueFrom:
                secretKeyRef: { name: keycloak-realm-keys, key: {{ $realm }}-signing-key }
            - name: KC_REALM_{{ upper $realm }}_SIGNING_CERT
              valueFrom:
                secretKeyRef: { name: keycloak-realm-keys, key: {{ $realm }}-signing-cert }
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 9000
          startupProbe:
            httpGet: { path: /health/started, port: management }
            periodSeconds: 5
            failureThreshold: 60
          # Ready only once the demo realm is imported and served.
          readinessProbe:
            httpGet: { path: /realms/demo/.well-known/openid-configuration, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health/live, port: management }
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: realm
              mountPath: /opt/keycloak/data/import
              readOnly: true
      volumes:
        - name: realm
          configMap:
            name: keycloak-realm
