# diagnosis-agent tasks that belong to the component: asking it, and running
# its scenarios. There is nothing to build: the agent is a prompt, a runbook
# and a list of tools, and kagent runs it.
#
#   task diagnosis-agent:ask -- "<text>"   one question through the gateway, as alert-automation
#   task diagnosis-agent:eval              run the scenarios under evals/ against the live cluster
#
# Included by the workload's Taskfile
# (agent-deployments/clusters/dev/workloads/diagnosis-agent/Taskfile.yml),
# which adds deploy, status and checks under the same name.
#
# Where the agent is and whose tokens to use come from the environment, which
# the root Taskfile sets for the dev cluster: DIAGNOSIS_AGENT_URL (default: the
# gateway on this machine), PLATFORM_TOKEN_CMD and, for the scenarios that
# compare the cluster before and after a turn, PLATFORM_KUBECONFIG and
# PLATFORM_CONTEXT.
version: "3"

tasks:
  ask:
    desc: 'Ask one question through the gateway: `task diagnosis-agent:ask -- "Alert X is firing for service search-service."` (flags: --as <user>, --context <id>, --raw)'
    silent: true
    cmds:
      - "{{.TASKFILE_DIR}}/scripts/ask.sh {{.CLI_ARGS}}"

  eval:
    desc: "Run the scenarios under evals/ against the cluster as it is now: `-- <scenario>` for one (each is one real model turn)"
    silent: true
    cmds:
      - "{{.TASKFILE_DIR}}/evals/run.sh {{.CLI_ARGS}}"
