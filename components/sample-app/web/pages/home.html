<h1>{{title}}</h1>
<p class="lede">{{description}}</p>

<table class="services">
  <caption class="visually-hidden">Services</caption>
  <thead class="visually-hidden">
    <tr><th scope="col">Service</th><th scope="col">Version</th><th scope="col">State</th></tr>
  </thead>
  <tbody id="services"></tbody>
</table>

<ul class="counts">
  <li id="count-indexed"><strong class="count-value">–</strong> <span class="count-label" data-one="record indexed">records indexed</span></li>
  <li id="count-registrations"><strong class="count-value">–</strong> <span class="count-label" data-one="registration today">registrations today</span></li>
</ul>

<p class="stamp">Last updated <time id="updated">never</time></p>
