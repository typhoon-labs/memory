<form id="search-form" class="search-form" role="search">
  <h1><label for="q">Search the catalogue</label></h1>
  <input id="q" name="q" type="search" autocomplete="off" placeholder="Colour, shape or size" autofocus>
</form>
<p class="chips">Try {{chips}}</p>

<div class="status-row">
  <p id="summary" class="summary"><strong id="indexed">–</strong> records indexed. <span id="matches"></span></p>
  <p class="stamp">Last updated <time id="updated">never</time></p>
</div>
<ol id="results" class="results"></ol>

<p id="versions" class="versions"></p>
