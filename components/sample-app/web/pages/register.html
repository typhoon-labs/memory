<h1>Register</h1>

<form id="register-form" class="register-form">
  <label for="name">Name</label>
  <input id="name" name="name" required maxlength="100" autocomplete="name">
  <label for="email">Email</label>
  <input id="email" name="email" type="email" required maxlength="200" autocomplete="email">
  <p id="form-error" class="form-error" role="alert" hidden></p>
  <button type="submit">Register</button>
</form>

<section id="confirmation" class="confirmation" aria-live="polite" hidden>
  <h2>Registered</h2>
  <p>Confirmation number</p>
  <p id="confirmation-number" class="confirmation-number"></p>
  <p id="confirmation-detail"></p>
  <button type="button" id="again">Register someone else</button>
</section>

<p id="versions" class="versions"></p>
