[project]
name = "chain-sts"
version = "0.1.0"
description = "Exchanges a user's token for one that names every agent the request passed through (RFC 8693 delegation)"
requires-python = ">=3.13"
dependencies = [
    "starlette>=1.7,<2",
    "uvicorn>=0.34.2,<1.0",
    # TokenReview calls to the Kubernetes API server.
    "httpx>=0.28.1,<1.0",
    "pyjwt[crypto]>=2.10,<3",
    "pyyaml>=6.0.3,<7.0",
    "opentelemetry-sdk>=1.30.0,<2.0",
    "opentelemetry-exporter-otlp>=1.30.0,<2.0",
    "opentelemetry-instrumentation-httpx>=0.51b0",
    "opentelemetry-instrumentation-starlette>=0.51b0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.1",
    # kagent's Python STS client (the one kagent-adk uses), to check the service against it.
    "agentsts-core==1.0.0a16",
]

[tool.uv]
# Run from source (python -m chain_sts with src on the path); nothing is built or installed.
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
# A refusal is named for what it is (Refusal), not with an Error suffix.
ignore = ["N818"]
