# Catalog entry for chat-assistant. Facts from docs/contracts.md
# and agent-deployments/clusters/dev/workloads/chat-assistant/.
#
# No `source.image`: the registry reads an image as "this can be deployed from
# here" and its UI then offers a Deploy button. This registry is a catalog and
# deploys nothing; the agent is released by agent-deployments. An Agent entry
# has no field for an address, so the gateway route is in the description.
apiVersion: ar.dev/v1alpha1
kind: Agent
metadata:
  name: chat-assistant
  labels:
    built-with: mastra
    runs-in: agents
    version: 0.1.9
spec:
  title: Chat assistant
  description: >-
    The chat agent behind the Chat UI (http://localhost:18083). It shows an
    incident as a card with the buttons of the signed-in role, lists the other
    incidents beside it, answers questions about the incident, and carries a
    button's action to the tool or agent that performs it, always with the
    caller's own token. A2A 1.0 and 0.3
    over JSON-RPC with the A2UI extension v0.9.1. Gateway route
    /a2a/chat-assistant, for any signed-in role. Its alert hook, POST
    /hooks/alert on the gateway, takes the firing alert from Alertmanager (role
    alert-automation only), opens the incident and asks diagnosis-agent. Calls
    remediation-agent, comms-agent and diagnosis-agent over A2A, through the
    gateway.
  source:
    protocol: A2A
  mcpServers:
    - kind: MCPServer
      name: delivery-mcp
