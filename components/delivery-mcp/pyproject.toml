[project]
name = "delivery-mcp"
version = "0.1.0"
description = "Incident and change state with separation-of-duties rules, enforced against the caller's verified identity"
authors = [
    {name = "agentgateway-demo"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    # kmcp v0.4.0 scaffolds fastmcp 3.0.0; this is the current release of that line.
    "fastmcp==3.4.8",
    "httpx>=0.28.1,<1.0",
    "pyyaml>=6.0.3,<7.0",
    "python-dotenv>=1.2.1,<2.0",
    "opentelemetry-sdk>=1.30.0,<2.0",
    "opentelemetry-exporter-otlp>=1.30.0,<2.0",
    "opentelemetry-instrumentation-httpx>=0.51b0",
    "opentelemetry-instrumentation-starlette>=0.51b0",
]

[tool.uv]
# Run from source (python src/main.py, as kmcp expects); nothing is built or installed.
package = false
dev-dependencies = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.1",
    "cryptography>=45",
    "pyjwt>=2.10",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
# The service errors are named for what they are (Refusal, NotFound), not with an Error suffix.
ignore = ["N818"]
