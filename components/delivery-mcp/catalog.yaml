# Catalog entry for delivery-mcp. Facts from docs/contracts.md
# and agent-deployments/clusters/dev/workloads/delivery-mcp/.
#
# `remote` is the registry's form for an MCP server that already runs and that
# the registry does not deploy. The URL is the gateway's route, as an agent in
# the cluster reaches it; from the host it is http://localhost:18080/mcp/delivery.
apiVersion: ar.dev/v1alpha1
kind: MCPServer
metadata:
  name: delivery-mcp
  labels:
    built-with: fastmcp
    runs-in: tools
    version: 0.1.1
spec:
  title: Delivery MCP
  description: >-
    Incident and change state for the Sample App, and the one way to change
    which version of a service runs. Ten tools: list_incidents and get_incident
    (any signed-in caller); open_incident and record_diagnosis
    (alert-automation); propose_change (developer); approve_change,
    reject_change and post_status_update (incident-manager); apply_change and
    restart_workload (platform-engineer). The gateway offers each caller only
    the tools of their role, and the service checks the role again and applies
    the rules only it can know: the caller's team owns the service, the
    approver is not the proposer, a change is applied only once approved.
    apply_change upgrades the Helm release and verifies with a real search.
    MCP over Streamable HTTP, a Keycloak token required. Gateway route
    /mcp/delivery.
  remote:
    type: streamable-http
    url: http://agentgateway-proxy.agentgateway-system.svc.cluster.local/mcp/delivery
