{{- /*
The prompt is a ConfigMap, not inline in the AgentTemplate, so that the text is
readable in the cluster as it was written. kagent watches it: an edit compiles
a new revision, and only conversations started after that use it.
*/ -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-prompt
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kagent-agent.labels" . | nindent 4 }}
data:
  system: {{ required "prompt: the system prompt" .Values.prompt | toJson }}
