# kagent 1.x: the controller, its API and A2A endpoint, and one WorkerPool.
# Values for chart oci://ghcr.io/kagent-dev/kagent/helm/kagent, 1.0.0-rc1.
#
# Reusable baseline. What one cluster changes goes in that cluster's own values
# file, listed after this one (agent-deployments/clusters/<name>/platform/60-kagent/).
#
# Two decisions differ from the chart's defaults, both for the same reason:
# an agent gets only what its own workload directory grants it.
#
#   1. No provider key. The chart's default ModelConfig points at the gateway's
#      model route and carries no credential, so it cannot reach a provider
#      and cannot pass the gateway either. Each agent brings its own
#      ModelConfig with its own gateway credential.
#   2. No bundled tool server. The chart's `kagent-tools` runs as
#      cluster-admin and serves 124 tools, writes and a `shell` included. A
#      workload that needs Kubernetes tools installs its own instance of the
#      same server, read-only, with a Role in the one namespace it may read
#      (agent-deployments/clusters/dev/workloads/diagnosis-agent/ shows how).

controller:
  # Substrate's API takes mutual TLS: the controller's pod certificate is who it
  # is there (`ateApi.authorization.bootstrapOwners` in substrate-values.yaml).
  substrateClientCertificate:
    enabled: true

# Database logins are client certificates. The Secrets the chart's defaults
# name come from release `kagent-postgresql`.
database:
  postgres:
    clientCertificate:
      enabled: true

# The controller's own configuration. The chart passes this through without a
# schema: a key anywhere else in this file is ignored without a word, and the
# controller then runs on the default, which for `server.auth` is `insecure`.
config:
  # Agent Substrate must already run in ate-system. The controller connects to
  # it at startup and restarts until it can. The router takes mutual TLS only,
  # with the same pod certificate as the API, and admits the controller by
  # name (`atenetRouter.ingressAllowedSPIFFEIDs` in substrate-values.yaml).
  substrate:
    apiEndpoint: dns:///api.ate-system.svc:443
    routerUrl: https://atenet-router.ate-system.svc:443

  # WHAT AN AGENT HAS BESIDES ITS OWN TOOLS. kagent's runtime gives every agent
  # built-in tools that no workload asked for, whatever its `tools` list says.
  # `bash` is the one that matters: it runs as root in the sandbox and its
  # traffic leaves through the egress gateway, which swaps the placeholders in
  # the agent's environment for the stored credentials. Measured on
  # diagnosis-agent (kagent 1.0.0-alpha17): it listed every tool of both MCP
  # servers (9 and 20, all read tools, where the template offers 7), and could
  # call the model route.
  #
  # These switches remove `bash`, `list_files`, `grep_file` and `ask_user`.
  # `ask_user` stops a turn to wait for an answer, and nobody answers an agent
  # that an alert or another agent calls. Nothing switches off `read_file`,
  # `write_file` or `edit_file`: they stay, and they reach the Actor's own
  # sandbox and no further. The agent's checks (`task diagnosis-agent:checks`)
  # fail if what it is offered changes.
  runtimeDefaults:
    builtinTools:
      disableBash: true
      disableFileSearch: true
      disableAskUser: true

  server:
    # Lets grpcurl discover the API. Sessions, checkpoints and the Substrate
    # status call have no HTTP form, so this is the only way to look at them
    # without the kagent CLI. Turn off outside a development cluster.
    grpcReflection: true

    # WHO IS CALLING. Port 8083 carries everything on one port: A2A (JSON-RPC and
    # gRPC), kagent's own API (create, edit and delete agents and templates, read
    # conversations) and an MCP endpoint. The open source build does not really
    # authenticate a person on it (read in alpha17's source, and again in
    # 1.0.0-rc1's):
    #
    #   insecure        every request is admitted, and every caller is the same
    #                   user, admin@kagent.dev, unless it names another in the
    #                   X-User-Id header. A token is ignored.
    #   trusted-proxy   one bearer token is required, and its payload is DECODED
    #                   BUT NOT VERIFIED: the signature is not checked, so a
    #                   token that nobody signed is accepted. Since rc1 an
    #                   expired one is refused.
    #
    # The one exception, in either mode: a token that presents itself as an
    # Actor's (claim `actor.ate.dev`, or Substrate's issuer) is verified against
    # Substrate's keys and never falls through to the above. Such a caller may
    # reach its own agent, session and memory and nothing else. A person is not
    # authorized at all: the open source controller sets no authorizer, so
    # whoever is admitted may do everything the API offers.
    #
    # So kagent trusts any person's token that reaches it, and two things
    # outside it do the work: the gateway route in front of an agent verifies
    # the token and passes it on, and the NetworkPolicy at the end of this file
    # lets nothing else reach the port.
    #
    # trusted-proxy is chosen because it makes that verified token count: the
    # owner of a conversation is the token's user (since rc1 an opaque id made
    # from the token's issuer and user), and another user who asks for it gets
    # "not found".
    auth:
      mode: trusted-proxy
      # Keycloak and Okta both carry the login name here; `sub` is an opaque id.
      userIdClaim: preferred_username

# The bundled UI is off in this profile. In trusted-proxy mode it needs a
# sign-in proxy in front of it to obtain a token (the chart's `oauth2-proxy`);
# without one every call it makes is refused as unauthenticated. The proxy
# needs an identity provider, and that is a cluster's own, so a cluster that
# wants the UI turns both on in its own values file: `oauth2-proxy.enabled`
# with its issuer and client, and `ui.replicas: 1`. The dev cluster does
# (agent-deployments/clusters/dev/platform/60-kagent/values.yaml). The
# NetworkPolicy `kagent-ui-callers` at the end of this file is the other half.
ui:
  replicas: 0

# Capacity for Actors, shared by every agent in this namespace. A Worker hosts
# one Actor, and only while a turn is running (an Actor is suspended to a
# snapshot at the end of every turn), so size this for turns that run at the
# same time, plus one for the golden snapshot kagent builds whenever an agent's
# definition changes. An idle Worker holds about 10 MiB. A turn that finds no
# free Worker fails with a plain timeout that names neither capacity nor the pool.
substrateWorkerPool:
  create: true
  name: kagent-default
  replicas: 2
  # kagent compiles every agent for the gVisor sandbox class; keep the pool on it.
  sandboxClass: gvisor
  # Substrate's release, pinned by digest.
  workerImage: ghcr.io/kagent-dev/substrate/ateworker-gvisor:v1.0.0-rc1@sha256:e56eb227908c5cca0edcabb5c72a9f20f6c525ab66e5131837084379d4095279

# The default ModelConfig (`default-model-config`). OpenAI wire format, because
# that is what Agentgateway's model route serves to kagent: kagent appends
# /chat/completions to baseUrl. No apiKeySecretRef on purpose; see point 1.
providers:
  default: openAI
  openAI:
    provider: OpenAI
    model: claude-haiku-4-5-20251001
    apiKeySecretRef: ""
    apiKeySecretKey: ""
    config:
      baseUrl: http://agentgateway-proxy.agentgateway-system.svc.cluster.local/v1

kagent-tools:
  enabled: false

# Rendered by the chart as part of the release.
extraObjects:
  # Who may open a connection to the controller's port. kagent verifies no
  # person's token (see config.server.auth above), so reaching the port is the
  # same as being allowed to do anything with it, as anyone.
  #
  #   the gateway's proxy    callers, after the route's policy verified their token
  #   Substrate's egress     Actors: the runtime stores each turn's task through
  #                          the controller's TaskStoreService
  #   the controller itself  it lists the tools of its own /mcp endpoint
  #   the UI                 when it is switched on; `kagent-ui-callers`
  #                          below decides who reaches the UI
  #
  # Everything else in the cluster is refused, including a pod that presents a
  # token it wrote itself. The kubelet's probes and `kubectl port-forward`
  # come from the node and are not affected.
  #
  # This selects the controller's pods for all ingress, so its metrics port
  # (controller.metrics, off) would need a rule here as well.
  - apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: kagent-controller-callers
      namespace: '{{ include "kagent.namespace" . }}'
    spec:
      podSelector:
        matchLabels:
          app.kubernetes.io/name: kagent
          app.kubernetes.io/instance: '{{ .Release.Name }}'
          app.kubernetes.io/component: controller
      policyTypes:
        - Ingress
      ingress:
        - ports:
            - protocol: TCP
              port: 8083
          from:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: agentgateway-system
              podSelector:
                matchLabels:
                  gateway.networking.k8s.io/gateway-name: agentgateway-proxy
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: ate-system
              podSelector:
                matchLabels:
                  app: atenet-egress
            - podSelector:
                matchLabels:
                  app.kubernetes.io/name: kagent
                  app.kubernetes.io/instance: '{{ .Release.Name }}'
                  app.kubernetes.io/component: controller
            - podSelector:
                matchLabels:
                  app.kubernetes.io/name: kagent
                  app.kubernetes.io/instance: '{{ .Release.Name }}'
                  app.kubernetes.io/component: ui

  # Who may open a connection to the UI. Its nginx passes whatever it is sent
  # on to the controller's port, bearer token included, and the policy above
  # lets it. Without this one, a pod that cannot reach the controller could
  # reach it through the UI with a token it wrote itself.
  #
  #   the sign-in proxy   the browser's only way in; it verifies the session
  #                       and attaches the token the identity provider issued
  #
  # Nothing else, so the UI's Service must stay ClusterIP and get no route of
  # its own: publish the proxy. kagent's chart installs no such policy and
  # says the operator must. It selects no pod while `ui.replicas` is 0.
  - apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: kagent-ui-callers
      namespace: '{{ include "kagent.namespace" . }}'
    spec:
      podSelector:
        matchLabels:
          app.kubernetes.io/name: kagent
          app.kubernetes.io/instance: '{{ .Release.Name }}'
          app.kubernetes.io/component: ui
      policyTypes:
        - Ingress
      ingress:
        - ports:
            - protocol: TCP
              port: 8080
          from:
            # The labels of the chart's oauth2-proxy subchart.
            - podSelector:
                matchLabels:
                  app.kubernetes.io/name: oauth2-proxy
                  app.kubernetes.io/instance: '{{ .Release.Name }}'
