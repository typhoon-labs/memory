# What each login connects with. No passwords: see values.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: kagent-postgres-owner
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  ownerConnectionString: postgresql://kagent_owner_user@kagent-postgresql.{{ .Release.Namespace }}.svc:5432/kagent?sslmode=verify-full&sslrootcert=/run/postgres.podcert.ate.dev/trust-bundle.pem&sslcert=/run/postgres.podcert.ate.dev/kagent_owner_user.pem&sslkey=/run/postgres.podcert.ate.dev/kagent_owner_user.pem
---
apiVersion: v1
kind: Secret
metadata:
  name: kagent-postgres-readwrite
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  readWriteConnectionString: postgresql://kagent_readwrite_user@kagent-postgresql.{{ .Release.Namespace }}.svc:5432/kagent?sslmode=verify-full&sslrootcert=/run/postgres.podcert.ate.dev/trust-bundle.pem&sslcert=/run/postgres.podcert.ate.dev/kagent_readwrite_user.pem&sslkey=/run/postgres.podcert.ate.dev/kagent_readwrite_user.pem
---
apiVersion: v1
kind: Secret
metadata:
  name: substrate-postgres-readwrite
  namespace: {{ .Values.substrateNamespace }}
type: Opaque
stringData:
  readWriteConnectionString: postgresql://substrate_readwrite_user@kagent-postgresql.{{ .Release.Namespace }}.svc:5432/kagent?sslmode=verify-full&sslrootcert=/run/servicedns.podcert.ate.dev/trust-bundle.pem&sslcert=/run/postgres.podcert.ate.dev/substrate_readwrite_user.pem&sslkey=/run/postgres.podcert.ate.dev/substrate_readwrite_user.pem
---
apiVersion: v1
kind: Secret
metadata:
  name: substrate-postgres-owner
  namespace: {{ .Values.substrateNamespace }}
type: Opaque
stringData:
  ownerConnectionString: postgresql://substrate_owner_user@kagent-postgresql.{{ .Release.Namespace }}.svc:5432/kagent?sslmode=verify-full&sslrootcert=/run/servicedns.podcert.ate.dev/trust-bundle.pem&sslcert=/run/postgres.podcert.ate.dev/substrate_owner_user.pem&sslkey=/run/postgres.podcert.ate.dev/substrate_owner_user.pem
