# Model access for one workload in its own name, not in a caller's.
#
# This header is where how a workload key works is stated. A file that uses
# one says which workload, which Secret and which route, and points here.
#
# WHY. The model route (HTTPRoute `model`) accepts a Keycloak token, which
# names a person or the alert automation. A kagent agent that should be known
# to the gateway as itself, whoever calls it, needs a credential of its own,
# and the one kind kagent 1.x can attach that names the workload is a fixed
# value from a Secret (rc1's `actorJwt` names a conversation; see below):
# Substrate's egress gateway adds it as `Authorization: Bearer <value>` when a
# request leaves the sandbox. A token that expires in 30 minutes is not a
# fixed value, and a provider key must never leave the gateway.
#
# WHAT. The same model backend, behind a second route with a second kind of
# credential: a key the gateway issued to this one workload.
#
#   HTTPRoute `model-<workload>`
#       /workloads/<workload>/v1/chat/completions, /messages and /models,
#       rewritten to /v1/... on the model backend
#   AgentgatewayPolicy `model-<workload>-auth`
#       apiKeyAuthentication, Strict: the caller presents a key whose SHA-256
#       the gateway knows, or gets 401. Then authorization,
#       `apiKey.workload == "<workload>"`: a known key is not enough, it must
#       be the one issued to <workload>
#
# THE KEY. It is created by mint-key.sh, not by this chart, and is in no file:
#
#   Secret    <workload namespace>/<workload>-gateway-key     the key, for the workload:
#       AGENTGATEWAY_API_KEY, and AUTHORIZATION_HEADER, the same key as a whole
#       header value ("Bearer <key>") for a client that sends a Secret's value
#       as it is (kagent's RemoteMCPServer)
#   ConfigMap <release namespace>/workload-key-<workload>     its hash and what it names,
#       labeled agentgateway-demo/workload-key=<workload>:
#       {"keyHash":"sha256:<hex>","metadata":{"workload":"...","namespace":"..."}}
#
# The gateway never has the key, only its hash. The policy finds the ConfigMap
# by its label, and reads the `workload` it names as `apiKey.workload`.
#
# One route per workload. Each workload has its own route and its own policy,
# and its key opens no other workload's. ../tool-access lets the same key open
# an MCP server, on a route of its own per workload (`<backend>-<workload>`)
# with the same two checks.
#
# It is not a provider key. It is worth nothing outside this gateway, opens
# only its workload's routes, names one workload (the gateway's log and its
# token and cost figures carry the route's name), and is revoked by deleting
# one ConfigMap: the gateway then knows no hash for it, and answers 401.
# mint-key.sh is safe to re-run and keeps an existing key; `--rotate` replaces
# it, and its header says what else a rotation needs. Which models the key may
# use is decided by the backend, as for every caller.
#
# THE ALTERNATIVE, which worked on kagent 1.0.0-alpha7: a ModelConfig with
# `apiKeyPassthrough: true` and no Secret sent the token of whoever called the
# agent on to the model route. The agent then used the ordinary route (/v1) and
# needed none of this. The gateway verified that token there as it does for
# everyone: a token nobody signed, which kagent itself accepts, got 401. A model
# call was then made as the caller, a person or alert-automation, and nothing
# named the workload. In alpha17 the field is `tokenPassthrough`, and tools have
# the same choice on `RemoteMCPServer`; neither was tried there, and rc1 keeps
# both. rc1 also offers `actorJwt`: Substrate's egress gateway mints a token
# for each Actor, which names a conversation and not the workload. Evaluated
# and not adopted (agent-deployments/clusters/dev/platform/60-kagent/README.md).
# This chart is for when the workload must be named, or must work whoever
# calls it.
#
# Install in the namespace of the model backend.
#
# Schema: Agentgateway 1.7, AgentgatewayPolicy `traffic.apiKeyAuthentication`.

# The workload this door is for. Required.
workload: ""

# The Gateway the route attaches to.
gateway:
  name: agentgateway-proxy
  namespace: agentgateway-system
  listener: http

# The model backend of the trunk's model route (AgentgatewayBackend in the
# release namespace).
backend:
  name: model-provider
