# Agent Substrate, the runtime every kagent 1.x agent runs on.
# Values for chart oci://ghcr.io/kagent-dev/substrate/helm/substrate, 1.0.0-rc1.
#
# Reusable baseline. What one cluster changes goes in that cluster's own values
# file, listed after this one (agent-deployments/clusters/<name>/platform/60-kagent/).
#
# The chart alone does not give a working install: its pods wait for identity
# material that only the `kubectl-ate` plugin creates, certificates from the
# separate chart `substrate-podcert`, and a prepared database. See
# agent-deployments/clusters/dev/platform/60-kagent/helmfile.yaml.

# Who may do anything in Substrate's API, which now authorizes every call. An
# empty list means the shared `ate-client` ServiceAccount alone, and kagent's
# controller could then do nothing. That account stays, for `kubectl-ate`: it
# is what `task kagent:status` and `task kagent:ate` use, and anyone who may
# mint its token is an owner, so give operators their own on a shared cluster.
ateApi:
  authorization:
    bootstrapOwners:
      - spiffe://cluster.local/ns/kagent/sa/kagent-controller
      - system:serviceaccount:ate-system:ate-client

# Who may reach an Actor through the router: callers by their pod certificate.
# Empty refuses everyone. kagent's controller is the one caller: a turn that
# comes in through the gateway reaches the agent by way of the controller.
atenetRouter:
  ingressAllowedSPIFFEIDs:
    - spiffe://cluster.local/ns/kagent/sa/kagent-controller

# kagent sets a snapshot location on every agent it compiles, from the
# Harness (agent-platform/profiles/kagent/agent, `harness.snapshotLocation`).
# Without this gate Substrate's API refuses the field and no agent compiles.
preview:
  - PerTemplateSnapshotLocation

# Which Secrets the egress gateway may read on behalf of an agent.
#
# An agent never holds a credential. kagent compiles `ModelConfig.apiKeySecret`
# and `RemoteMCPServer.headersFrom` into a rule on the agent's egress policy,
# and Substrate's egress gateway reads the Secret and writes the header as the
# request leaves. This list is the grant for that read, and it is empty by
# default: without an entry every pod is healthy and every model call fails
# with 403.
#
# An atespace is named after the Kubernetes namespace of the Agent. Agents in
# namespace `kagent` may use Secrets in namespace `kagent`, and nowhere else.
credentialProvider:
  namespacePolicies:
    - atespace: kagent
      allowedNamespaces: [kagent]

# Substrate's own schema in the database it shares with kagent. Logins are
# client certificates; the connection Secrets come from release
# `kagent-postgresql`, under the names the chart defaults to.
postgres:
  clientCertificates:
    enabled: true
