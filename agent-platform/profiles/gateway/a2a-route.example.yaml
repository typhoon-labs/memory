# Gateway pattern: an A2A agent behind the gateway.
#
#   - the caller needs a valid token (issuer and audience)
#   - the agent receives the caller's Authorization header, so it can act as
#     the caller on its own next hop
#
# An example to copy, not a release. Worked for `remediation-agent` in
# namespace `agents`. Replace names, namespace and port. The namespace must
# exist. Issuer, audience and key URL are the dev cluster's values from
# agent-deployments/access/identity.yaml.
#
# Clients reach it at:
#   from a pod    http://agentgateway-proxy.agentgateway-system.svc.cluster.local/a2a/remediation-agent
#   from the host http://localhost:18080/a2a/remediation-agent
#
# Schema: Agentgateway 1.6 (agentgateway.dev/v1alpha1), from
#   https://agentgateway.dev/docs/kubernetes/latest/documentation/agent/a2a/
#   https://agentgateway.dev/docs/kubernetes/latest/documentation/security/backend-authn/key/
#
# VERIFIED BY APPLYING, 2026-10-06, Agentgateway 1.6.0 on Kubernetes 1.37,
# against a stub HTTP server that reports the request it receives:
#   - all three resources accepted, policy attached
#   - no token: 401, on the JSON-RPC endpoint and on the agent card
#   - with a token the stub received POST / with the identical
#     `Authorization: Bearer <token>` header
#   - the agent card is fetched from the agent at /.well-known/agent-card.json
#     and its `url` is rewritten to the address the client used, including the
#     route prefix (http://localhost:18080/a2a/remediation-agent from the host)
#   - a card with neither `url` nor `supportedInterfaces` is answered with 503
# NOT VERIFIED: a real A2A agent or SDK client, streaming, the commented
# role rule, and the A2UI extension.
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: remediation-agent
  namespace: agents
spec:
  # The a2a type tells the gateway to treat this traffic as A2A; the Service
  # needs no appProtocol.
  a2a:
    host: remediation-agent.agents.svc.cluster.local
    port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: remediation-agent
  namespace: agents
spec:
  parentRefs:
    - name: agentgateway-proxy
      namespace: agentgateway-system
      sectionName: http
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /a2a/remediation-agent
      filters:
        # The agent serves A2A at its root path, so the gateway prefix is
        # removed: /a2a/remediation-agent/x reaches the agent as /x.
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: remediation-agent
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: remediation-agent-auth
  namespace: agents
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: remediation-agent
  traffic:
    jwtAuthentication:
      # Strict covers every path of the route, including the agent card at
      # /a2a/remediation-agent/.well-known/agent-card.json.
      mode: Strict
      providers:
        - issuer: http://localhost:18081/realms/demo
          audiences:
            - agentgateway
          jwks:
            remote:
              url: http://keycloak.keycloak.svc.cluster.local:8080/realms/demo/protocol/openid-connect/certs
              cacheDuration: 5m
    # Optional: limit the agent to some roles. Left out, any valid token passes.
    # authorization:
    #   action: Allow
    #   policy:
    #     matchExpressions:
    #       - '"platform-engineer" in jwt.roles'
  backend:
    auth:
      # By default the gateway removes the Authorization header after it has
      # validated the token, and the agent receives none. Passthrough sends the
      # validated token on to the agent, as `Authorization: Bearer <token>`.
      passthrough: {}
