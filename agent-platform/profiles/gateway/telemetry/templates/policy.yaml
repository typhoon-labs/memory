{{- /*
The agents acting for the caller, as CEL attributes. Each is left out of a
record when its expression fails, as `jwt.act.sub` does on a token without
`act`. `default` stands in for a deeper `act` that is not there.
*/ -}}
{{- define "telemetry.actorAttributes" -}}
{{- $depth := int .Values.accessLog.chainDepth -}}
{{- if lt $depth 1 }}{{ fail "accessLog.chainDepth: at least 1" }}{{ end -}}
{{- $names := list "default(jwt.act.client_id, jwt.act.sub)" -}}
{{- range $i := untilStep 2 (int (add1 $depth)) 1 -}}
  {{- $path := printf "jwt%s" (repeat $i ".act") -}}
  {{- $names = append $names (printf "default(%s.client_id, default(%s.sub, \"\"))" $path $path) -}}
{{- end -}}
- name: actor.sub
  expression: jwt.act.sub
- name: actor.chain
  expression: {{ printf "[%s].filter(n, n != \"\").join(\",\")" (join ", " $names) | quote }}
{{- end -}}
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: telemetry
  namespace: {{ .Release.Namespace }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.gateway.name }}
  frontend:
    # One span per request, with the HTTP attributes and, by traffic type, the
    # gen_ai.* (model) and mcp.* (tool) attributes.
    tracing:
      backendRef:
        name: {{ .Values.collector.service }}
        namespace: {{ .Values.collector.namespace }}
        port: {{ .Values.collector.port }}
      protocol: GRPC
      randomSampling: {{ .Values.tracing.randomSampling | quote }}
      resources:
        # Values are CEL expressions, so a constant is a quoted string.
        - name: deployment.environment
          expression: {{ .Values.tracing.environment | quote | squote }}
      {{- if or .Values.tracing.caller .Values.tracing.llmContent }}
      attributes:
        add:
          {{- if .Values.tracing.caller }}
          # Who called, from the token the gateway has just verified. On a
          # request without one (a preflight, a refusal with 401, a workload
          # that presents a gateway key) the expressions do not resolve and the
          # span simply has no such attribute.
          - name: user.id
            expression: jwt.preferred_username
          - name: user.roles
            expression: jwt.roles
          - name: user.team
            expression: jwt.team
          # The agent acting for the caller, and the chain before it.
          {{- include "telemetry.actorAttributes" . | nindent 10 }}
          {{- end }}
          {{- if .Values.tracing.llmContent }}
          - name: gen_ai.prompt
            expression: llm.prompt
          - name: gen_ai.completion
            expression: llm.completion
          {{- end }}
      {{- end }}
    # One log record per request, in addition to the line on the proxy's stdout.
    accessLog:
      {{- if .Values.accessLog.caller }}
      # On the stdout line, and on the record sent to the collector, which
      # takes these when `otlp` sets no attributes of its own.
      attributes:
        add:
          - name: user.id
            expression: jwt.preferred_username
          {{- include "telemetry.actorAttributes" . | nindent 10 }}
      {{- end }}
      otlp:
        backendRef:
          name: {{ .Values.collector.service }}
          namespace: {{ .Values.collector.namespace }}
          port: {{ .Values.collector.port }}
        protocol: GRPC
