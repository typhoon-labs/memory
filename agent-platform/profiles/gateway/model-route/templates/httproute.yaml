apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Values.route.name }}
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
    - name: {{ .Values.gateway.name }}
      namespace: {{ .Values.gateway.namespace }}
      sectionName: {{ .Values.gateway.listener }}
  rules:
    - matches:
        # Anthropic Messages API, including /v1/messages/count_tokens.
        - path: { type: PathPrefix, value: /v1/messages }
        # OpenAI-compatible chat completions.
        - path: { type: PathPrefix, value: /v1/chat/completions }
        - path: { type: PathPrefix, value: /v1/models }
      filters:
        # The provider credential is held by the gateway. A key that a client
        # sends is dropped here, so it can never reach the provider.
        - type: RequestHeaderModifier
          requestHeaderModifier:
            remove:
              - x-api-key
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: {{ .Values.backend.name }}
