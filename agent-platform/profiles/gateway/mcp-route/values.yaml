# One MCP server behind the gateway:
#
#   AgentgatewayBackend <route.name>         the server, over Streamable HTTP
#   HTTPRoute <route.name>                   <route.path> on the shared Gateway
#   AgentgatewayPolicy <route.name>-tools    which role may see and call which tool
#
# Who is a valid caller, and that the server receives the caller's token, is a
# separate release of agent-platform/policies/agentgateway/route-auth that
# targets HTTPRoute <route.name>. Install both in the server's namespace.
#
# Schema: Agentgateway 1.7 (agentgateway.dev/v1alpha1), from
#   https://agentgateway.dev/docs/kubernetes/latest/documentation/mcp/static-mcp/
#   https://agentgateway.dev/docs/kubernetes/latest/documentation/mcp/tool-access/
#   https://agentgateway.dev/docs/kubernetes/latest/documentation/security/backend-authn/key/
#
# The pattern (these three resources and a route-auth policy with passthrough)
# was verified by applying, 2026-10-06, Agentgateway 1.6.0 on Kubernetes 1.37,
# against a stub MCP server (FastMCP, Streamable HTTP) with ten tools that
# have a rule and one that has none:
#   - all four resources accepted, both policies attached
#   - no token: 401 on initialize
#   - tools/list per role returns exactly that role's tools plus the
#     "any signed-in" tools; the tool without a rule is listed for nobody
#   - tools/call of a tool the role may not use: JSON-RPC error "unknown
#     resource", the same as for a tool that does not exist
#   - the server received the caller's own bearer token (passthrough)
# The routing an interactive client needs to sign in by itself is
# `mcpAuthentication` below. The settings for it are in route-auth.

# The Gateway this route attaches to.
gateway:
  name: agentgateway-proxy
  namespace: agentgateway-system
  listener: http

route:
  # Names the HTTPRoute and the AgentgatewayBackend.
  name: ""
  # The path prefix clients use, for example /mcp/delivery. The gateway serves
  # MCP at exactly this path; nothing is appended.
  path: ""

backend:
  # A Service in the release namespace.
  service: ""
  port: 8080
  # The server's own MCP endpoint path.
  path: /mcp
  # Stateless: the gateway keeps no session, so a request does not depend on
  # which proxy pod answered an earlier one, or on the proxy not having
  # restarted. For a server that keeps per-session state, use Stateful.
  sessionRouting: Stateless

# Optional: route what an MCP client of a person's own (an IDE or a CLI) needs
# to sign in by itself (MCP authorization, RFC 9728). Off by default. Turn it
# on together with the same option of the route's route-auth release, which
# reads the same route file. That option writes the policy for rule `sign-in`
# and explains what it answers.
#
# On, the HTTPRoute has two rules, both to the same backend:
#   mcp      <route.path> with an Authorization header. The route's own
#            policy checks the token, as it does with the option off. So
#            an expired or a wrong token gets that policy's plain 401,
#            without the pointer to the metadata.
#   sign-in  <route.path> without one, and the metadata paths
#            /.well-known/oauth-protected-resource<route.path> and
#            /.well-known/oauth-authorization-server<route.path> (with
#            /client-registration under it). PathPrefix, as in
#            https://agentgateway.dev/docs/kubernetes/latest/documentation/mcp/auth/setup/
# Why two rules: Agentgateway 1.7.0 serves the metadata, and puts the pointer
# to it in the 401, only from a policy that trusts a single issuer. A route
# that also takes the token exchange's tokens needs that policy on a rule of
# its own, one that no request with a token reaches.
mcpAuthentication:
  enabled: false

# Tool name -> roles (values of the token's `roles` claim) that may see it in
# tools/list and call it. "*" means any caller with a valid token. A tool that
# is not listed here is hidden from everyone.
tools: {}

# Tool name -> the agents that may see it and call it on a user's behalf: a
# token with an `act` claim gets the tool only when `delegation.issuer`
# signed it and its newest actor (`jwt.act.sub`) is one of these, in addition
# to the roles above. Names come
# from `delegation.agents` (agent -> the `sub` the token exchange writes for
# it), which the cluster's identity.yaml gives. A tool listed in `tools` and
# not here is not offered to any token with `act`; a token without `act`, the
# caller's own, is decided by `tools` alone. A name that is not in `tools`
# or not in `delegation.agents` stops the render.
toolActors: {}
# Whose tokens are a caller's own: a token without `act` passes the rules on
# agents only when this issuer made it. From identity.yaml, `identity`.
identity:
  issuer: ""
delegation:
  issuer: ""
  agents: {}
