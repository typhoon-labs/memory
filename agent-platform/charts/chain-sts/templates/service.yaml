apiVersion: v1
kind: Service
metadata:
  name: {{ include "chain-sts.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "chain-sts.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "chain-sts.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: http
