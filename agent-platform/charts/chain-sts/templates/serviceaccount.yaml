# The service's identity. With authDelegator.enabled, for the TokenReview
# actor check, it is bound to the ClusterRole <release>-token-review, which
# allows creating TokenReviews alone (clusterrole.yaml,
# clusterrolebinding.yaml), and to nothing else; without, to nothing. The
# `jwks` check needs no binding: reading the cluster's keys at
# /openid/v1/jwks, every service account may do (the default
# ClusterRoleBinding system:service-account-issuer-discovery).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "chain-sts.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "chain-sts.labels" . | nindent 4 }}
