# One AgentgatewayPolicy for one route: the caller must present a bearer token
# from a trusted issuer with the expected audience. Install it in the route's
# namespace, before or together with the route. A second policy, for an MCP
# client's own sign-in, is `mcpAuthentication` at the end.
#
# Schema: Agentgateway 1.7, AgentgatewayPolicy `traffic.jwtAuthentication` and
# `traffic.authorization`
# (https://agentgateway.dev/docs/kubernetes/latest/documentation/security/jwt/setup/).
#
# After validation the gateway removes the Authorization header, so the backend
# does not receive the caller's token. A route whose backend must act as the
# caller sets `passthrough: true` below.

# The route to protect.
target:
  group: gateway.networking.k8s.io
  kind: HTTPRoute
  name: ""

# Whose tokens are trusted. A cluster's values are in
# agent-deployments/clusters/<cluster>/identity.yaml.
identity:
  # Must equal the token's `iss` claim exactly.
  issuer: ""
  # The token's `aud` claim must contain this value.
  audience: ""
  # Where the gateway fetches the signing keys. An in-cluster address: the
  # issuer URL is the browser's address and is not reachable from a pod.
  jwksUrl: ""

# Optional: further audiences a token from `identity`'s issuer may carry on
# this route instead of identity.audience, for a client whose tokens are meant
# for this route's backend alone (the Chat UI's, for chat-assistant). One
# matching audience is enough. Every other route keeps identity.audience
# alone, so such a token works nowhere else. Not used for `delegation`.
extraAudiences: []

# Optional: a second trusted issuer, a token exchange (chain-sts) that issues
# tokens to an agent acting for a user, from the same identity.yaml. Its
# tokens carry the user's claims, so the rules in `allow` apply to them
# unchanged. It is trusted only on a route that names its `resource` below.
# Empty `issuer`: the issuer above alone is trusted.
# Checked with Agentgateway 1.6.0: while one issuer's keys have never been
# fetched (its service is not installed yet), its tokens are refused with 401
# and the other issuer's are accepted. The controller retries about every 15
# seconds.
delegation:
  issuer: ""
  jwksUrl: ""
  # Each target that takes the exchange's tokens, by name, with its resource
  # identifier (RFC 8707): an absolute URI, the token's `aud`. Each token is
  # for one target. `resource` below names this route's entry.
  resources: {}
  # Optional, for a rollout only: an audience every route with a `resource`
  # accepts besides its own, such as the one audience the exchange issued
  # for before it issued one per target. Empty: each route takes its own.
  audience: ""
  # The agents that may act for a user, by name, each with the `sub` the
  # token exchange writes for it in `act` (its Kubernetes service account).
  # `actors` below names agents from this map.
  agents: {}

# Which entry of `delegation.resources` this route is. The gateway then
# accepts a token from `delegation.issuer` only when its `aud` holds that
# URI (or `delegation.audience`, while set), so a token the exchange issued
# for another target is refused here with 401, and one issued for this route
# works nowhere else: the backend that receives it (`passthrough`) cannot
# replay it. Empty: the route does not trust `delegation.issuer` at all, and
# `actors` must be empty.
resource: ""

# Which agent may call this route on a user's behalf. A token whose `act`
# claim names an acting agent is let in only when `delegation.issuer` signed
# it and its newest actor (the outermost `act`, `jwt.act.sub`) is one of
# these agents, looked up in `delegation.agents`; the inner `act` claims, the
# agents before it, are not read. A token without `act`, the user's or the machine client's own, is
# decided by `allow` alone. Empty: no token with `act` is let in, whichever
# issuer signed it. This holds in addition to `allow`, never instead.
actors: []

# Optional rules on the verified claims, as CEL expressions. The request is
# allowed when any one expression is true and `actors` above lets it in.
# Empty means any caller with a valid token, as far as `actors` allows.
# Example: '"incident-manager" in jwt.roles'
allow: []

# true: the backend receives the caller's validated token as
# `Authorization: Bearer <token>`, so it can apply its own rules and call its
# own next hop as the caller. false: the header is removed (the model route).
passthrough: false

# Optional: let an MCP client of a person's own (an IDE or a CLI) find where
# to sign in by itself (MCP authorization, RFC 9728). Off by default. Only for
# a route of the mcp-route chart with its own `mcpAuthentication.enabled`,
# which adds the rule `sign-in` this targets. Both releases read the same
# route file.
#
# Schema: Agentgateway 1.7.0, AgentgatewayPolicy
# `traffic.jwtAuthentication.mcp` with `provider`, `clientId` and
# `resourceMetadata`
# (https://agentgateway.dev/docs/kubernetes/latest/documentation/mcp/auth/setup/,
# and for what each provider does
# https://agentgateway.dev/docs/standalone/latest/documentation/configuration/security/mcp-authn/).
#
# On, a second AgentgatewayPolicy, <target.name>-sign-in, on that rule only.
# The gateway then:
#   - answers a request without a token with 401 and
#     `WWW-Authenticate: Bearer resource_metadata="<origin>/.well-known/oauth-protected-resource<path>"`
#   - serves that protected resource metadata, which names the gateway
#     itself, at <origin><path>, as the authorization server
#   - serves /.well-known/oauth-authorization-server<path>, made from the
#     provider's OIDC discovery document, which it fetches from
#     `identity.issuer` when asked. So the issuer must be reachable from the
#     gateway's pods, and the dev cluster's is not.
#   - answers client registration at that path + /client-registration
# Each address is made from the request's own, unless resourceMetadata says
# otherwise.
# Why a second policy: Agentgateway 1.7.0 refuses `mcp` on a jwtAuthentication
# with more than one provider. Its CRD says "jwtAuthentication.mcp requires
# exactly one provider", and its controller and proxy check the same. A route
# with `delegation` trusts two issuers. So the requests that bring a token
# keep the policy above, and this one serves only those that bring none.
mcpAuthentication:
  enabled: false
  # Agentgateway's adapter for the authorization server: Auth0, Authentik,
  # Descope, Entra, Keycloak or Okta. Keycloak: metadata from its OIDC
  # discovery. Registration is proxied to Keycloak, which sends CORS headers
  # on its registration endpoint only for the origins a realm policy allows.
  provider: Keycloak
  # A client registered beforehand, public with PKCE. Set: the gateway itself
  # answers every registration request with this client ID and proxies none.
  # Empty: registration goes to the provider (Keycloak: anonymous
  # registration, which its "Trusted Hosts" policy refuses by default).
  clientId: ""
  # More fields of the protected resource metadata, in camelCase. The gateway
  # writes them in snake_case. Unset, `resource` and `authorizationServers`
  # come from the request's address. Set them only when clients reach the
  # gateway at an address it does not see.
  # Example: bearerMethodsSupported: [header]
  resourceMetadata: {}
