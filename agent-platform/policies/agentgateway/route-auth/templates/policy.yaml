{{- $target := required "target.name: the route to protect" .Values.target.name -}}
{{- /*
The rule on `act`: a token without it that the identity provider issued (a
person's or a machine client's own), or one the token exchange issued whose
newest actor is a listed agent. Only the exchange checked the agent (its
Kubernetes token), so an `act` another issuer wrote names nobody the route
expects; and the exchange always writes `act`, so a token of its own without
one is refused, whoever made it with its key. `has(jwt.act)` is false when
the claim is absent; `jwt.act.sub` on a token without `act` would be an
error, which the gateway counts as false.
*/ -}}
{{- $subs := list -}}
{{- range .Values.actors -}}
  {{- $sub := index ($.Values.delegation.agents | default dict) . -}}
  {{- if not $sub -}}
    {{- fail (printf "actors: %q is not in delegation.agents" .) -}}
  {{- end -}}
  {{- $subs = append $subs $sub -}}
{{- end -}}
{{- /*
The audiences a token from the exchange may carry here: this route's own
resource, and during a rollout the shared audience. A route without a
`resource` takes none of its tokens, so it does not trust the exchange at
all. A provider is never written without an audience: Agentgateway accepts
any audience when a provider lists none ("Omit the field to accept any
audience", and an empty list does the same: its JWT setup page, 1.7).
*/ -}}
{{- $delegated := list -}}
{{- with .Values.resource -}}
  {{- $uri := index ($.Values.delegation.resources | default dict) . -}}
  {{- if not $uri -}}
    {{- fail (printf "resource: %q is not in delegation.resources" .) -}}
  {{- end -}}
  {{- $delegated = append $delegated $uri -}}
  {{- with $.Values.delegation.audience -}}
    {{- $delegated = append $delegated . -}}
  {{- end -}}
{{- end -}}
{{- if and $subs (not $delegated) -}}
  {{- fail "actors: a route that agents call on a user's behalf needs `resource`, the target their tokens are for" -}}
{{- end -}}
{{- $act := printf "(!has(jwt.act) && jwt.iss == %q)" (required "identity.issuer" .Values.identity.issuer) -}}
{{- if $subs -}}
  {{- $issuer := required "delegation.issuer: the issuer whose `act` names the agents" ($.Values.delegation.issuer | default "") -}}
  {{- $act = printf "%s || (jwt.iss == %q && jwt.act.sub in %s)" $act $issuer (toJson $subs) -}}
{{- end -}}
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: {{ $target }}-auth
  namespace: {{ .Release.Namespace }}
spec:
  targetRefs:
    - group: {{ .Values.target.group }}
      kind: {{ .Values.target.kind }}
      name: {{ $target }}
  traffic:
    jwtAuthentication:
      # Strict: a request without a valid token is refused with 401.
      mode: Strict
      providers:
        - issuer: {{ required "identity.issuer" .Values.identity.issuer | quote }}
          # The token's `aud` must contain one of these.
          audiences:
            - {{ required "identity.audience" .Values.identity.audience | quote }}
            {{- range .Values.extraAudiences }}
            - {{ . | quote }}
            {{- end }}
          jwks:
            remote:
              url: {{ required "identity.jwksUrl" .Values.identity.jwksUrl | quote }}
              cacheDuration: 5m
        {{- with .Values.delegation }}
        {{- if and .issuer $delegated }}
        # The token exchange's tokens for an agent acting for a user, issued
        # for this route alone. A token is checked by the provider whose
        # issuer is its `iss`.
        - issuer: {{ .issuer | quote }}
          # The token's `aud` must contain one of these.
          audiences:
            {{- range $delegated }}
            - {{ . | quote }}
            {{- end }}
          jwks:
            remote:
              url: {{ required "delegation.jwksUrl" .jwksUrl | quote }}
              cacheDuration: 5m
        {{- end }}
        {{- end }}
    authorization:
      action: Allow
      policy:
        matchExpressions:
          # The rules in `allow` are alternatives, joined into one expression,
          # and the rule on `act` must hold as well. Agentgateway 1.6.0 also
          # treats separate matchExpressions entries as alternatives (checked
          # by running, and so its code and documentation say), but its API
          # reference says all must be true. One expression means the same
          # under either reading.
          {{- if .Values.allow }}
          - {{ printf "((%s)) && (%s)" (join ") || (" .Values.allow) $act | quote }}
          {{- else }}
          - {{ $act | quote }}
          {{- end }}
  {{- if .Values.passthrough }}
  backend:
    auth:
      # Without this the gateway removes the Authorization header once it has
      # validated the token. Passthrough sends the same token on to the backend,
      # which needs it to act as the caller.
      passthrough: {}
  {{- end }}
