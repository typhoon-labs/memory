{{- $target := required "target.name: the route to protect" .Values.target.name -}}
{{- /*
The rule on `act`: a token without it, or one the token exchange issued whose
newest actor is a listed agent. Only the exchange checked the agent (its
Kubernetes token), so an `act` another issuer wrote names nobody the route
expects. `has(jwt.act)` is false when the claim is absent; `jwt.act.sub` on a
token without `act` would be an error, which the gateway counts as false.
*/ -}}
{{- $subs := list -}}
{{- range .Values.actors -}}
  {{- $sub := index ($.Values.delegation.agents | default dict) . -}}
  {{- if not $sub -}}
    {{- fail (printf "actors: %q is not in delegation.agents" .) -}}
  {{- end -}}
  {{- $subs = append $subs $sub -}}
{{- end -}}
{{- $act := "!has(jwt.act)" -}}
{{- if $subs -}}
  {{- $issuer := required "delegation.issuer: the issuer whose `act` names the agents" ($.Values.delegation.issuer | default "") -}}
  {{- $act = printf "!has(jwt.act) || (jwt.iss == %q && jwt.act.sub in %s)" $issuer (toJson $subs) -}}
{{- end -}}
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: {{ $target }}-auth
  namespace: {{ .Release.Namespace }}
spec:
  targetRefs:
    - group: {{ .Values.target.group }}
      kind: {{ .Values.target.kind }}
      name: {{ $target }}
  traffic:
    jwtAuthentication:
      # Strict: a request without a valid token is refused with 401.
      mode: Strict
      providers:
        - issuer: {{ required "identity.issuer" .Values.identity.issuer | quote }}
          # The token's `aud` must contain one of these.
          audiences:
            - {{ required "identity.audience" .Values.identity.audience | quote }}
            {{- range .Values.extraAudiences }}
            - {{ . | quote }}
            {{- end }}
          jwks:
            remote:
              url: {{ required "identity.jwksUrl" .Values.identity.jwksUrl | quote }}
              cacheDuration: 5m
        {{- with .Values.delegation }}
        {{- if .issuer }}
        # The token exchange's tokens for an agent acting for a user. A token
        # is checked by the provider whose issuer is its `iss`.
        - issuer: {{ .issuer | quote }}
          audiences:
            - {{ required "delegation.audience" .audience | quote }}
          jwks:
            remote:
              url: {{ required "delegation.jwksUrl" .jwksUrl | quote }}
              cacheDuration: 5m
        {{- end }}
        {{- end }}
    authorization:
      action: Allow
      policy:
        matchExpressions:
          # The rules in `allow` are alternatives, joined into one expression,
          # and the rule on `act` must hold as well. Agentgateway 1.6.0 also
          # treats separate matchExpressions entries as alternatives (checked
          # by running, and so its code and documentation say), but its API
          # reference says all must be true. One expression means the same
          # under either reading.
          {{- if .Values.allow }}
          - {{ printf "((%s)) && (%s)" (join ") || (" .Values.allow) $act | quote }}
          {{- else }}
          - {{ $act | quote }}
          {{- end }}
  {{- if .Values.passthrough }}
  backend:
    auth:
      # Without this the gateway removes the Authorization header once it has
      # validated the token. Passthrough sends the same token on to the backend,
      # which needs it to act as the caller.
      passthrough: {}
  {{- end }}
