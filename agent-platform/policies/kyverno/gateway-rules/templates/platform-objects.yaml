# Nobody but a deployer changes or deletes a gateway resource of the platform.
#
# The other three policies stop a resource from being added next to the
# platform's. This one stops the direct way: editing the platform's policy,
# deleting it, or removing Helm's label from a route so that it no longer
# counts as the platform's. RBAC cannot say this, because a team's own gateway
# resources and the platform's are of the same kinds in the same namespaces.
#
# The cluster's own controllers are left alone: the namespace controller and
# the garbage collector must be able to delete these resources when their
# namespace or owner goes.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: gateway-platform-objects
spec:
  validationActions:
    - Deny
  evaluation:
    background:
      enabled: false
  matchConstraints:
    resourceRules:
      - apiGroups: ["agentgateway.dev"]
        apiVersions: ["*"]
        operations: ["UPDATE", "DELETE"]
        resources: ["agentgatewaypolicies", "agentgatewaybackends"]
      - apiGroups: ["gateway.networking.k8s.io"]
        apiVersions: ["*"]
        operations: ["UPDATE", "DELETE"]
        resources: ["gateways", "httproutes", "grpcroutes", "referencegrants"]
  matchConditions:
    - name: not-a-deployer
      expression: >-
        !{{ include "gateway-rules.deployer" . }}
    - name: not-a-cluster-controller
      expression: >-
        !(request.userInfo.username.startsWith("system:serviceaccount:kube-system:")
          || (request.userInfo.username.startsWith("system:") && !request.userInfo.username.startsWith("system:serviceaccount:")))
  validations:
    - expression: >-
        !{{ include "gateway-rules.released" "oldObject" }}
      messageExpression: >-
        oldObject.kind + " " + oldObject.metadata.namespace + "/" + oldObject.metadata.name
        + " is part of platform release " + oldObject.metadata.annotations["meta.helm.sh/release-name"]
        + ". Only the platform's releases change or delete it. "
        + {{ .Values.platform.changeHint | toJson }}
