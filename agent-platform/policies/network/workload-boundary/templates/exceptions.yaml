{{- range $name, $exception := .Values.exceptions }}
{{- if not $exception.podLabels }}
{{- fail (printf "exceptions.%s.podLabels: name the workload; an exception is for one workload, not for the namespace" $name) }}
{{- end }}
{{- if not (or $exception.ingress $exception.egress) }}
{{- fail (printf "exceptions.%s: give ingress or egress rules" $name) }}
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      {{- toYaml $exception.podLabels | nindent 6 }}
  policyTypes:
    {{- if $exception.ingress }}
    - Ingress
    {{- end }}
    {{- if $exception.egress }}
    - Egress
    {{- end }}
  {{- with $exception.ingress }}
  ingress:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $exception.egress }}
  egress:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
